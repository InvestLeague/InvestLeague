<title>Devolução de PNR · EsAO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Celular primeiro: uma coluna estreita. O painel da coordenação abre em duas colunas a partir de 960px. */
:root {
  --bg: #f1f3ef;
  --surface: #ffffff;
  --surface-2: #e8ebe5;
  --ink: #15201a;
  --muted: #56615a;
  --line: #d3d9d1;
  --accent: #2c5a37;
  --accent-ink: #ffffff;
  --accent-soft: #dce9df;
  --heat: #2c5a37;
  --ok: #1a7a2a; --ok-soft: #dff1e1;
  --warn: #8a5a00; --warn-soft: #fcefd2;
  --bad: #b3261e; --bad-soft: #fbe2df;
  --pend: #5b5f6b; --pend-soft: #e7e8ec;
  --focus: #1f6feb;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1311; --surface: #181d1a; --surface-2: #222924; --ink: #ecf0ea; --muted: #a2ada5; --line: #303833;
    --accent: #86c495; --accent-ink: #0d1a10; --accent-soft: #23382a; --heat: #86c495;
    --ok: #6fd07c; --ok-soft: #1d3322; --warn: #f1bf55; --warn-soft: #3a2f14; --bad: #ff8a80; --bad-soft: #3d1f1c;
    --pend: #b8bcc8; --pend-soft: #2a2c33; --focus: #7aa8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1311; --surface: #181d1a; --surface-2: #222924; --ink: #ecf0ea; --muted: #a2ada5; --line: #303833;
  --accent: #86c495; --accent-ink: #0d1a10; --accent-soft: #23382a; --heat: #86c495;
  --ok: #6fd07c; --ok-soft: #1d3322; --warn: #f1bf55; --warn-soft: #3a2f14; --bad: #ff8a80; --bad-soft: #3d1f1c;
  --pend: #b8bcc8; --pend-soft: #2a2c33; --focus: #7aa8ff;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- topo ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 200px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.brand h1 { font-size: 21px; line-height: 1.1; font-weight: 700; }
.views { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.views button { border: 0; background: transparent; padding: 7px 13px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.views button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; width: 100%; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--pend); display: inline-block; flex: none; }
.conn.on i { background: var(--ok); }
.conn.off i { background: var(--bad); }
.banner { max-width: 1240px; margin: 12px auto 0; padding: 0 16px; }
.banner > div { border-radius: 10px; padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); background: var(--surface); }
.banner .w { background: var(--warn-soft); border-color: transparent; }
.banner .b { background: var(--bad-soft); border-color: transparent; }

/* ---------- blocos comuns ---------- */
.wrap { max-width: 640px; margin: 0 auto; padding: 16px 16px 130px; }
.wide { max-width: 1240px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stack { display: grid; gap: 10px; }
.q { font-size: 27px; font-weight: 700; line-height: 1.12; margin-bottom: 6px; }
.hint { color: var(--muted); margin: 0 0 14px; max-width: 62ch; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.big { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 2px 9px; width: fit-content; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.pend { background: var(--pend-soft); color: var(--pend); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.acc { background: var(--accent-soft); color: var(--accent); }
.field { display: grid; gap: 6px; margin-top: 14px; }
.field label, .lab { font-weight: 700; font-size: 14px; }
.field small { color: var(--muted); font-size: 13px; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 11px 12px; width: 100%; }
.field textarea { min-height: 72px; resize: vertical; }
.empty { color: var(--muted); font-size: 14px; padding: 8px 0; }
.sep { height: 1px; background: var(--line); margin: 14px 0; }

/* explicação fixa no topo de cada tela: onde estou, o que faço, o que acontece depois */
.guide { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-size: 14px; }
.guide b { display: block; font-family: var(--f-display); font-size: 17px; margin-bottom: 2px; }
.guide p { margin: 4px 0 0; }
.guide .after { color: var(--muted); font-size: 13px; margin-top: 6px; }

/* etapas do aluno */
.steps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-bottom: 16px; }
.steps button { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.steps button:disabled { cursor: default; }
.steps .bar { height: 4px; border-radius: 2px; background: var(--line); }
.steps .on .bar, .steps .done .bar { background: var(--accent); }
.steps .lbl { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps .on .lbl { color: var(--ink); font-weight: 700; }
.stepn { font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }

/* lista de opções grandes */
.opts { display: grid; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: left; display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; align-items: start; width: 100%; }
.opt .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 2px; display: grid; place-items: center; }
.opt[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.opt[aria-checked="true"] .radio { border-color: var(--accent); }
.opt[aria-checked="true"] .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.opt strong { font-size: 16px; }
.opt small, .opt .sub { grid-column: 2; color: var(--muted); font-size: 13px; }
.opt .tags { grid-column: 2; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }

/* caixas de marcar */
.chk { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: left; display: grid; grid-template-columns: 24px 1fr; gap: 2px 10px; align-items: start; width: 100%; }
.chk .box { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--muted); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: transparent; margin-top: 1px; }
.chk[aria-checked="true"] { border-color: var(--accent); }
.chk[aria-checked="true"] .box { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.chk strong { font-size: 15px; font-weight: 700; }
.chk .sub { grid-column: 2; color: var(--muted); font-size: 13px; }
.chk.crit { border-left: 4px solid var(--bad); }

/* termos */
.termo { max-height: 46vh; overflow: auto; border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--surface); font-size: 14px; }
.termo h3 { font-size: 17px; margin: 14px 0 4px; font-family: var(--f-body); font-weight: 700; }
.termo h3:first-child { margin-top: 0; }
.termo p, .termo li { margin: 4px 0; }
.termo ul { padding-left: 20px; margin: 4px 0; }
.termo .crit { background: var(--bad-soft); border-radius: 8px; padding: 8px 10px; margin: 8px 0; }
.scrollmark { font-size: 13px; color: var(--muted); margin-top: 8px; display: flex; gap: 6px; align-items: center; }
.scrollmark.done { color: var(--ok); font-weight: 600; }

/* "como fazer" expansível */
.howto { grid-column: 1 / -1; margin-top: 8px; background: var(--surface-2); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
.howto ol, .howto ul { padding-left: 18px; margin: 4px 0; }
.howto a { color: var(--focus); }
.more { grid-column: 2; justify-self: start; border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 13px; padding: 4px 0; text-decoration: underline; }

/* progresso do checklist */
.prog { background: var(--surface-2); border-radius: 999px; height: 10px; overflow: hidden; margin: 6px 0 14px; }
.prog i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }

/* calendário */
.mtabs { display: grid; grid-auto-flow: column; gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.mtabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.mtabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.wk, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.wk { margin: 12px 0 4px; }
.wk span { font-size: 11px; text-align: center; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.day { position: relative; border: 1px solid transparent; background: var(--surface); border-radius: 8px; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; padding: 2px; }
.day.blank { background: transparent; }
.day .dn { line-height: 1; }
.day .vg { font-size: 10px; font-weight: 700; line-height: 1; }
.day.livre { background: var(--ok-soft); color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.day.curto { background: var(--warn-soft); color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
.day.nao { background: var(--surface-2); color: var(--muted); }
.day.cheio { background: var(--pend-soft); color: var(--pend); }
.day.sel { outline: 3px solid var(--ink); outline-offset: -1px; z-index: 1; }
.day.ideal::after { content: ""; position: absolute; top: 3px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--ok); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.legend i { width: 14px; height: 12px; border-radius: 3px; display: inline-block; border: 1px solid var(--line); }

/* lista de tempos do dia escolhido */
.slots { display: grid; gap: 8px; margin-top: 14px; }
.slot { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; width: 100%; }
.slot .h { font-family: var(--f-display); font-size: 20px; font-weight: 700; }
.slot .why { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
.slot.livre { border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.slot.off { background: var(--surface-2); }
.turno-h { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; margin-top: 10px; }

/* cartão do próximo passo */
.next { border: 2px solid var(--accent); border-radius: 14px; padding: 14px; background: var(--surface); }
.next.okb { border-color: var(--ok); }
.next.badb { border-color: var(--bad); }
.next.warnb { border-color: var(--warn); }
.next .big { font-family: var(--f-display); font-size: 25px; font-weight: 700; line-height: 1.1; }
.next .when { font-family: var(--f-display); font-size: 21px; font-weight: 700; margin-top: 4px; }
.next dl { margin: 10px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 14px; }
.next dt { color: var(--muted); }
.next dd { margin: 0; }
.leve { background: var(--warn-soft); border-radius: 10px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
.leve ul { margin: 4px 0 0; padding-left: 20px; }
.countdown { display: flex; gap: 8px; margin-top: 12px; }
.countdown div { flex: 1; background: var(--surface-2); border-radius: 10px; padding: 8px 10px; text-align: center; }
.countdown b { display: block; font-family: var(--f-display); font-size: 26px; line-height: 1; }
.countdown span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

/* painel / instrutor */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-size: 32px; font-weight: 700; line-height: 1; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi.ok .v { color: var(--ok); } .kpi.bad .v { color: var(--bad); } .kpi.pend .v { color: var(--pend); } .kpi.warn .v { color: var(--warn); }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sec-h h2 { font-size: 21px; font-weight: 700; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13px; }
.dash { max-width: 1240px; margin: 0 auto; padding: 16px 16px 60px; display: grid; gap: 14px; }
.ped { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.ped.urg { border-color: var(--warn); background: var(--warn-soft); }
.ped h3 { font-family: var(--f-body); font-size: 16px; font-weight: 700; }
.ped dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
.ped dt { color: var(--muted); }
.ped dd { margin: 0; }
.ped .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.todo { background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-weight: 600; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th, .tbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.tbl th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 600; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; }
.bar2 { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; min-width: 60px; }
.bar2 i { display: block; height: 100%; background: var(--accent); }
.alerta { border-radius: 10px; padding: 10px 12px; font-size: 14px; display: grid; gap: 8px; margin-bottom: 8px; }
.alerta.w { background: var(--warn-soft); }
.alerta.b { background: var(--bad-soft); }
.alerta b { font-weight: 700; }
.heat { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.heat div { border-radius: 6px; min-height: 44px; padding: 3px 4px; font-size: 11px; background: color-mix(in srgb, var(--heat) var(--h, 0%), var(--surface)); border: 1px solid var(--line); }
.heat div.hot { color: var(--accent-ink); }
.heat b { display: block; font-family: var(--f-display); font-size: 16px; }
.evl { list-style: none; margin: 0; padding: 0; }
.evl li { padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.evl li:last-child { border-bottom: 0; }
.evl small { color: var(--muted); display: block; }

/* roteiro de vistoria */
.rot { display: grid; gap: 6px; }
.rot .it { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; }
.rot .it strong { font-size: 14px; font-weight: 700; }
.rot .it small { grid-column: 1 / -1; color: var(--muted); font-size: 12px; }
.rot .it button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 14px; }
.rot .it .y[aria-pressed="true"] { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.rot .it .n[aria-pressed="true"] { background: var(--bad-soft); color: var(--bad); border-color: var(--bad); }

/* ajuda, modal, toast */
.helpbtn { position: fixed; right: 14px; bottom: calc(86px + env(safe-area-inset-bottom, 0px)); z-index: 18; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 10px 16px; font-weight: 700; box-shadow: 0 2px 10px rgb(0 0 0 / .12); }
.navbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 19; }
.navbar-in { max-width: 640px; margin: 0 auto; display: flex; gap: 10px; }
.navbar .btn { flex: 1; padding: 13px; font-size: 16px; }
.navbar .btn.pri { flex: 2; }
.modal { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 50; display: flex; align-items: flex-end; justify-content: center; padding: 12px; }
.modal .card { width: 100%; max-width: 580px; max-height: 88vh; overflow: auto; }
.modal h2 { font-size: 22px; margin-bottom: 8px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 10px; font-weight: 600; z-index: 60; max-width: calc(100% - 32px); }
.faq { display: grid; gap: 6px; }
.faq details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.faq summary { font-weight: 700; cursor: pointer; font-size: 14px; }
.faq p { margin: 6px 0 0; font-size: 14px; }

@media (min-width: 640px) {
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .day { min-height: 62px; }
  .modal { align-items: center; }
}
@media (min-width: 960px) {
  .dash { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); align-items: start; }
  .dash .full { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .btn, .opt, .chk, .day, .slot { transition: background-color .12s, box-shadow .12s, border-color .12s; }
}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="eyebrow" id="eyebrow">EsAO · Devolução de PNR 2026</span>
      <h1 id="h1">Agendar a entrega do PNR</h1>
    </div>
    <div class="views" id="views" role="group" aria-label="Escolher tela" hidden></div>
    <div class="conn" id="conn"><i></i><span>Conectando…</span></div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<main id="app"><div class="wrap"><p class="empty">Carregando…</p></div></main>
<div id="layer"></div>

<script>
"use strict";

/* ===================== textos fixos ===================== */

const TEMPOS_PADRAO = [
  { k: "M1", ini: "08:00", fim: "09:15", turno: "manha" },
  { k: "M2", ini: "09:30", fim: "10:45", turno: "manha" },
  { k: "M3", ini: "11:00", fim: "12:15", turno: "manha" },
  { k: "T1", ini: "13:30", fim: "14:45", turno: "tarde" },
  { k: "T2", ini: "15:00", fim: "16:15", turno: "tarde" },

    if (est.chaveInvalida) banner("<b>Essa chave não vale mais.</b> Abrindo a tela do aluno. Peça o link certo à coordenação.", "w");
    const vivos = (est.meus || []).filter(a => ["solicitado", "encaixe", "confirmado", "pendencias", "recusado"].includes(a.situacao));
    S.meu = vivos.sort((a, b) => (b.atualizadoEm || "") > (a.atualizadoEm || "") ? 1 : -1)[0] || null;
    if (!S.mes) S.mes = (est.cfg && est.cfg.inicio) ? String(est.cfg.inicio).slice(0, 7) : null;
    S.carregando = false;
    conn("on", API.kind === "demo" ? "Modo demonstração · dados só neste aparelho"
      : S.papel === "painel" ? "Painel da coordenação" : S.papel === "instrutor" ? "Conectado · " + S.eu : "Conectado");
    render();
  } catch (e) {
    S.carregando = false;
    if (!silencioso) { conn("off", "Sem conexão"); banner("<b>Não foi possível falar com a base.</b> Verifique a internet e recarregue a página. " + esc(e.message || ""), "b"); }
    render();
  }
}

async function acao(fn, ...args) {
  if (S.enviando) return null;
  S.enviando = true; S.erro = ""; render();
  try {
    const r = await API.call(fn, ...args);
    S.enviando = false;
    if (r && r.ok === false) { S.erro = r.erro || "Não foi possível concluir."; render(); return r; }
    return r;
  } catch (e) {
    S.enviando = false;
    S.erro = e.message || "Falha na conexão. Tente de novo.";
    render();
    return null;
  }
}

/* ===================== regras de disponibilidade ===================== */

const tempos = () => (S.est && S.est.tempos && S.est.tempos.length ? S.est.tempos : TEMPOS_PADRAO);
const tempoDe = k => tempos().find(t => t.k === k) || null;
const instDe = nome => ((S.est && S.est.instrutores) || []).find(i => i.nome === nome) || null;

/**
 * Por que este tempo não pode ser marcado. Devolve {cls, txt}; txt vazio = pode.
 * cls: livre | fds | feriado | fora | bloqueado | cheio | viagem | curto | passou | fim
 * Mesma ordem do backend, para a tela nunca prometer o que o servidor recusa.
 */
function motivo(est, instrutor, data, tempoK, opts) {
  opts = opts || {};
  const cfg = est.cfg || {};
  const t = (est.tempos || TEMPOS_PADRAO).find(x => x.k === tempoK);
  if (!t) return { cls: "nao", txt: "Tempo inválido." };
  if (data < cfg.inicio) return { cls: "passou", txt: "Essa data já passou." };
  if (data > cfg.fim) return { cls: "fim", txt: "A campanha termina em " + f3(cfg.fim) + "." };

  const d = wd(data);
  if (d === 0 || d === 6) return { cls: "fds", txt: "Fim de semana: não há vistoria de PNR." };

  const fer = (est.feriados || {})[data];
  if (fer && fer.tipo === "dia") return { cls: "feriado", txt: fer.n + ": feriado, sem vistoria." };
  if (fer && fer.tipo === "tarde" && t.turno === "tarde") return { cls: "feriado", txt: fer.n + ": só há vistoria pela manhã." };

  const inst = (est.instrutores || []).find(i => i.nome === instrutor);
  if (!inst) return { cls: "nao", txt: "Escolha um instrutor da lista." };
  if (!(inst.janelas || []).some(j => data >= j.ini && data <= j.fim))
    return { cls: "fora", txt: "O " + inst.nome + " só recebe vistorias em: " + inst.dispTexto + "." };

  for (const b of (est.bloqueios || [])) {
    if (b.data !== data) continue;
    if (b.instrutor !== "TODOS" && b.instrutor !== instrutor) continue;
    if (b.tempo !== "TODOS" && b.tempo !== tempoK) continue;
    return { cls: "bloqueado", txt: "O " + inst.nome + " bloqueou esse horário" + (b.motivo ? ": " + b.motivo : ".") };
  }

  // A ocupação que o aluno recebe vem sem id; a exclusão só vale ao remarcar o próprio pedido.
  const oc = (est.ocupados || []).find(o => o.instrutor === instrutor && o.data === data && o.tempo === tempoK
    && !(opts.id && o.id === opts.id));
  if (oc) return { cls: "cheio", txt: "Horário já ocupado" + (oc.nomeGuerra ? ": " + oc.nomeGuerra : ".") };

  if (opts.viagem) {
    if (data > opts.viagem) return { cls: "viagem", txt: "É depois da sua viagem (" + f3(opts.viagem) + ")." };
    if (data === opts.viagem) return { cls: "viagem", txt: "É o dia da sua viagem. Se houver pendência, você não tem tempo de corrigir. Escolha 2 ou 3 dias antes." };
  }

  if (!opts.porInstrutor && !opts.excecao) {
    const horas = (horaDe(data, t.ini).getTime() - Date.now()) / 36e5;
    const min = cfg.horasMinimas == null ? 72 : cfg.horasMinimas;
    if (horas < min) return { cls: "curto", txt: "Faltam menos de " + min + " h. Só com pedido de encaixe ao instrutor." };
  }
  return { cls: "livre", txt: "" };
}

/** Os 6 tempos de um dia, já com o motivo de cada um. */
function temposDoDia(data, instrutor, opts) {
  return tempos().map(t => {
    const m = motivo(S.est, instrutor, data, t.k, opts);
    return { t, cls: m.cls, txt: m.txt, livre: !m.txt };
  });
}

/** Resumo do dia para o calendário. */
function resumoDia(data, instrutor, opts) {
  const lst = temposDoDia(data, instrutor, opts);
  const livres = lst.filter(x => x.livre).length;
  if (livres) return { cls: "livre", n: livres, txt: livres + (livres > 1 ? " tempos livres" : " tempo livre") };
  const curto = lst.filter(x => x.cls === "curto").length;
  if (curto) return { cls: "curto", n: curto, txt: curto + " tempo(s) só com encaixe" };
  const cheio = lst.filter(x => x.cls === "cheio").length;
  if (cheio === lst.length) return { cls: "cheio", n: 0, txt: "Dia cheio" };
  return { cls: "nao", n: 0, txt: lst[0] ? lst[0].txt : "Indisponível" };
}

/** Meses com dias dentro do período da campanha. */
function mesesDaCampanha() {
  const cfg = (S.est && S.est.cfg) || {};
  if (!cfg.inicio) return [];
  const out = [];
  let a = anoDe(cfg.inicio), m = mesDe(cfg.inicio);
  const aF = anoDe(cfg.fim), mF = mesDe(cfg.fim);
  while (a < aF || (a === aF && m <= mF)) {
    out.push({ ym: a + "-" + ("0" + (m + 1)).slice(-2), nome: MES_NOME[m], curto: MES_CURTO[m] + "/" + String(a).slice(2) });
    m++; if (m > 11) { m = 0; a++; }
  }
  return out;
}

function diasDoMes(ym) {
  const [a, m] = ym.split("-").map(Number);
  const out = [];
  const ult = new Date(Date.UTC(a, m, 0)).getUTCDate();
  for (let d = 1; d <= ult; d++) out.push(ym + "-" + ("0" + d).slice(-2));
  return out;
}

/* --- passo 5: escolher horário --- */
function passoHorario() {
  const inst = instDe(S.dados.instrutor);
  if (!inst) return '<div class="alerta b"><b>Escolha um instrutor</b><span>Volte ao passo 2.</span></div>' + nav(1, null, "");
  const opts = { viagem: S.dados.viagem };
  const meses = mesesDaCampanha();
  if (!S.mes || !meses.some(m => m.ym === S.mes)) S.mes = meses[0] ? meses[0].ym : null;

  const dias = S.mes ? diasDoMes(S.mes) : [];
  const primeiro = dias.length ? wd(dias[0]) : 0;
  const cel = [];
  for (let i = 0; i < primeiro; i++) cel.push('<span class="day blank"></span>');
  let totalLivre = 0;
  dias.forEach(d => {
    const r = resumoDia(d, inst.nome, opts);
    if (r.cls === "livre") totalLivre += r.n;
    const dias3 = S.dados.viagem ? difDias(d, S.dados.viagem) : null;
    const ideal = dias3 !== null && dias3 >= 2 && dias3 <= 3 && r.cls === "livre";
    cel.push('<button class="day ' + r.cls + (S.dia === d ? " sel" : "") + (ideal ? " ideal" : "")
      + '" data-act="dia" data-d="' + d + '" aria-label="' + f3(d) + ": " + esc(r.txt) + '">'
      + '<span class="dn">' + (+d.slice(8, 10)) + "</span>"
      + (r.n ? '<span class="vg">' + r.n + "</span>" : "") + "</button>");
  });

  const livresNaJanela = inst.janelas.map(j => f3(j.ini) + " a " + f3(j.fim)).join(" e ");

  let detalhe = "";
  if (S.dia) {
    const lst = temposDoDia(S.dia, inst.nome, opts);
    const dias3 = S.dados.viagem ? difDias(S.dia, S.dados.viagem) : null;
    let aviso = "";
    if (dias3 === 1) aviso = '<div class="alerta w"><b>Só 1 dia antes da viagem</b><span>Dá para marcar, mas se houver pendência o prazo é curtíssimo. Se puder, escolha 2 ou 3 dias antes.</span></div>';
    else if (dias3 !== null && dias3 >= 2 && dias3 <= 3) aviso = '<div class="alerta w" style="background:var(--ok-soft)"><b>Prazo ideal</b><span>' + dias3 + " dias antes da sua viagem. Se aparecer pendência, você tem tempo de corrigir.</span></div>";
    const bloco = turno => '<p class="turno-h">' + (turno === "manha" ? "Manhã" : "Tarde") + "</p>"
      + lst.filter(x => x.t.turno === turno).map(x =>
        '<button class="slot ' + (x.livre ? "livre" : "off") + '" data-act="' + (x.livre ? "pedir" : x.cls === "curto" ? "encaixe" : "porque") + '" data-k="' + x.t.k + '">'
        + '<span class="h">' + x.t.ini + " às " + x.t.fim + "</span>"
        + (x.livre ? '<span class="pill ok">Livre · tocar para pedir</span>'
          : x.cls === "curto" ? '<span class="pill warn">⚡ Pedir encaixe</span>'
            : '<span class="pill pend">Indisponível</span>')
        + (x.txt ? '<span class="why">' + esc(x.txt) + "</span>" : '<span class="why">Vistoria de 1 h 15. Toque para pedir este horário ao ' + esc(inst.nome) + ".</span>")
        + "</button>").join("");
    detalhe = '<div class="sep"></div><h2 class="q">' + fw(S.dia) + "</h2>" + aviso
      + '<div class="slots">' + bloco("manha") + bloco("tarde") + "</div>";
  }

  return guia("Escolher o dia e o horário",
    "Toque num <b>dia verde</b> e depois no horário. Dias cinza têm o motivo explicado ao toque.",
    "o " + esc(inst.nome) + " recebe o pedido e confirma. Você acompanha nesta tela.")
    + '<div class="card" style="margin-bottom:12px"><strong>' + esc(inst.nome) + "</strong>"
    + '<p style="margin:4px 0 0;color:var(--muted);font-size:14px">Recebe vistorias em ' + esc(livresNaJanela || inst.dispTexto) + ". "
    + (totalLivre ? "<b>" + totalLivre + " tempo(s) livre(s)</b> neste mês." : "Nenhum tempo livre neste mês: veja os outros meses.") + "</p>"
    + '<button class="btn sm" data-act="go" data-i="1" style="margin-top:10px">Trocar de instrutor</button></div>'
    + '<div class="mtabs" role="group">' + meses.map(m =>
      '<button data-act="mes" data-v="' + m.ym + '" aria-pressed="' + (S.mes === m.ym) + '">' + m.curto + "</button>").join("") + "</div>"
    + '<div class="wk">' + WD_CURTO.map((w, i) => '<span>' + w + "</span>").join("") + "</div>"
    + '<div class="grid">' + cel.join("") + "</div>"
    + '<div class="legend">'
    + '<span><i style="background:var(--ok-soft);border-color:var(--ok)"></i> livre</span>'
    + '<span><i style="background:var(--warn-soft);border-color:var(--warn)"></i> só com encaixe</span>'
    + '<span><i style="background:var(--pend-soft)"></i> cheio</span>'
    + '<span><i style="background:var(--surface-2)"></i> sem vistoria</span>'
    + '<span><i style="background:var(--ok);border-radius:50%;width:8px;height:8px"></i> prazo ideal (2 a 3 dias antes da viagem)</span>'
    + "</div>" + detalhe
    + nav(4, null, "");
}

function nav(voltar, proximo, rotulo) {
  const b = voltar !== null && voltar !== undefined
    ? '<button class="btn" data-act="go" data-i="' + voltar + '">Voltar</button>' : "";
  const p = rotulo
    ? '<button class="btn pri" data-act="go" data-i="' + (proximo === null ? "" : proximo) + '"' + (proximo === null ? " disabled" : "") + ">" + esc(rotulo) + "</button>"
    : "";
  if (!b && !p) return "";
  return '<div class="navbar"><div class="navbar-in">' + b + p + "</div></div>";
}

/* --- tela de acompanhamento do aluno --- */
function renderStatus() {
  const a = S.meu, t = tempoDe(a.tempo) || { ini: "", fim: "" };
  const faltamCheck = CHECK.filter(c => !S.checklist[c.k]);
  const dias = difDias(S.est.hoje, a.data);
  const diasViagem = a.viagem ? difDias(S.est.hoje, a.viagem) : null;

  const cab = {
    solicitado: ["warnb", "⏳ Aguardando confirmação", "O " + a.instrutor + " recebeu o seu pedido. Enquanto ele não confirmar, o horário fica reservado para você."],
    encaixe: ["warnb", "⚡ Encaixe em análise", "Você pediu um horário com menos de 72 h. O " + a.instrutor + " vai decidir se aprova."],
    confirmado: ["okb", "✅ Vistoria CONFIRMADA", "Está marcado. Compareça no dia e na hora, pessoalmente e sozinho."],
    recusado: ["badb", "❌ Pedido recusado", "O " + a.instrutor + " não pôde atender nesse horário." + (a.motivo ? " Motivo: " + a.motivo : "") + (a.sugestao ? " Sugestão dele: " + a.sugestao : "")],
    pendencias: ["badb", "⚠️ Vistoria com pendências", "A chave não foi recebida. Corrija os itens abaixo e marque uma nova vistoria."],
    entregue: ["okb", "🎉 Chaves recebidas", "PNR entregue e processo encerrado. Bom trabalho e boa viagem."]
  }[a.situacao] || ["", a.situacao, ""];

  let acoes = "";
  if (a.situacao === "confirmado" || a.situacao === "solicitado" || a.situacao === "encaixe") {
    acoes = '<div class="row-btns" style="margin-top:12px">'
      + '<button class="btn pri" data-act="ics">📅 Pôr na agenda do celular</button>'
      + '<button class="btn danger" data-act="cancelar">Cancelar</button></div>';
  } else if (a.situacao === "pendencias" || a.situacao === "recusado") {
    acoes = '<div class="row-btns" style="margin-top:12px">'
      + '<button class="btn pri big" data-act="remarcar">' + (a.situacao === "pendencias" ? "Já corrigi, marcar nova vistoria" : "Escolher outro horário") + "</button></div>";
  }

  const leve = a.situacao === "confirmado" ? '<div class="leve"><b>No dia, leve e faça:</b><ul>'
    + "<li><b>Todas as chaves e cópias</b>, controles de portão e do ar-condicionado</li>"
    + "<li><b>Comprovantes da Light e da Naturgy</b>, com a conta encerrada e quitada</li>"
    + "<li>Cópia do <b>Termo de Recebimento</b> do PNR</li>"
    + "<li>Compareça <b>pessoalmente</b> e <b>sozinho</b>: a família não acompanha</li>"
    + "<li>Ligue o <b>ar-condicionado</b> antes, para confirmar que está gelando</li>"
    + "</ul></div>" : "";

  const pend = (a.pendencias && a.pendencias.length)
    ? '<div class="alerta b" style="margin-top:12px"><b>Corrija estes itens antes da nova vistoria</b><span><ul style="margin:4px 0 0;padding-left:20px">'
    + a.pendencias.map(p => "<li>" + esc(p) + "</li>").join("") + "</ul></span></div>" : "";

  const alertaCheck = (a.situacao === "confirmado" && faltamCheck.length)
    ? '<div class="alerta w" style="margin-top:12px"><b>' + faltamCheck.length + " item(ns) do checklist ainda sem marcar</b><span><ul style=\"margin:4px 0 0;padding-left:20px\">"
    + faltamCheck.slice(0, 5).map(c => "<li>" + esc(c.t) + "</li>").join("")
    + "</ul>Se não estiver pronto no dia, a chave não é recebida.</span>"
    + '<button class="btn sm" data-act="verCheck">Abrir o checklist</button></div>' : "";

  const conta = (a.situacao === "confirmado" && dias >= 0) ? '<div class="countdown">'
    + "<div><b>" + dias + "</b><span>dias para a vistoria</span></div>"
    + (diasViagem !== null ? "<div><b>" + diasViagem + "</b><span>dias para a viagem</span></div>" : "")
    + "<div><b>" + faltamCheck.length + "</b><span>itens a concluir</span></div></div>" : "";

  return guia("Seu agendamento",
    "Esta é a sua tela de acompanhamento. Guarde o link: é por aqui que você vê a resposta do instrutor.",
    "")
    + '<div class="next ' + cab[0] + '">'
    + '<div class="big">' + cab[1] + "</div>"
    + '<div class="when">' + fw(a.data) + " · " + t.ini + " às " + t.fim + "</div>"
    + "<p style=\"margin:6px 0 0;color:var(--muted)\">" + esc(cab[2]) + "</p>"
    + "<dl><dt>Instrutor</dt><dd>" + esc(a.instrutor) + "</dd>"
    + "<dt>Aluno</dt><dd>" + esc(a.nomeGuerra) + "</dd>"
    + (a.endereco ? "<dt>PNR</dt><dd>" + esc(a.endereco) + "</dd>" : "")
    + (a.viagem ? "<dt>Sua viagem</dt><dd>" + f3(a.viagem) + "</dd>" : "")
    + "</dl>" + conta + leve + pend + alertaCheck + acoes
    + "</div>"
    + '<div class="row-btns" style="margin-top:14px">'
    + '<button class="btn" data-act="ajuda">Dúvidas frequentes</button>'
    + '<button class="btn" data-act="zap">💬 Falar com o instrutor</button>'
    + '<button class="btn" data-act="recarregar">Atualizar</button></div>';
}

/* ===================== render: instrutor ===================== */

function renderInstrutor() {
  const ags = S.est.agendamentos || [];
  const pend = ags.filter(a => a.situacao === "solicitado" || a.situacao === "encaixe")
    .sort((a, b) => (a.situacao === "encaixe" ? -1 : 1) - (b.situacao === "encaixe" ? -1 : 1) || (a.criadoEm > b.criadoEm ? 1 : -1));
  const conf = ags.filter(a => a.situacao === "confirmado").sort((a, b) => a.data + a.tempo > b.data + b.tempo ? 1 : -1);
  const inst = instDe(S.eu) || { total: 0, dispTexto: "", janelas: [] };
  const feitos = ags.filter(a => a.situacao === "entregue").length;
  const comPend = ags.filter(a => a.situacao === "pendencias").length;

  const primeiroAcesso = !localStorage.getItem("pnr-inst-ok");
  if (primeiroAcesso) return '<div class="dash"><div class="sec full">' + renderOnboardingInstrutor(inst) + "</div></div>";

  const hojeL = conf.filter(a => a.data === S.est.hoje);
  const ultimoDia = inst.janelas.length ? inst.janelas[inst.janelas.length - 1].fim : S.est.cfg.fim;
  const diasRest = difDias(S.est.hoje, ultimoDia);
  const faltam = Math.max(0, (inst.total || 0) - (feitos + conf.length + pend.length));

  const topo = '<div class="sec full">' + guia(S.abaInst === "pedidos" ? "Pedidos aguardando o senhor"
    : S.abaInst === "hoje" ? "Vistorias de hoje" : S.abaInst === "agenda" ? "Sua agenda completa" : "Ferramentas",
    S.abaInst === "pedidos" ? "Confirme ou recuse cada pedido. Os marcados com <b>⚡</b> são encaixes, com menos de 72 h."
      : S.abaInst === "hoje" ? "Em ordem de horário, com endereço e roteiro de vistoria."
        : S.abaInst === "agenda" ? "Tudo o que está marcado, e o resultado do que já foi vistoriado."
          : "Agendar por um aluno, liberar exceção, bloquear horário e cadastrar o seu e-mail.",
    S.abaInst === "pedidos" ? "o aluno vê a sua resposta na tela dele, na hora." : "")
    + '<div class="kpis">'
    + '<div class="kpi warn"><div class="v">' + pend.length + '</div><div class="l">pedidos aguardando</div></div>'
    + '<div class="kpi"><div class="v">' + conf.length + '</div><div class="l">confirmadas</div></div>'
    + '<div class="kpi ok"><div class="v">' + feitos + "/" + (inst.total || 0) + '</div><div class="l">chaves recebidas</div></div>'
    + '<div class="kpi bad"><div class="v">' + comPend + '</div><div class="l">com pendências</div></div>'
    + "</div>"
    + (diasRest >= 0 && diasRest <= 10 && faltam > 0
      ? '<div class="alerta w" style="margin-top:12px"><b>Sua disponibilidade termina em ' + diasRest + " dia(s), em " + f3(ultimoDia) + "</b>"
      + "<span>Pelo total da escala, cerca de <b>" + faltam + " aluno(s)</b> seus ainda não agendaram. Cobre a turma: sem agendamento, eles ficam sem instrutor.</span></div>"
      : "")
    + "</div>";

  let corpo = "";
  if (S.abaInst === "pedidos") {
    corpo = '<div class="sec full"><div class="sec-h"><h2>Pedidos</h2><p>' + pend.length + " aguardando</p></div>"
      + (pend.length ? '<div class="stack">' + pend.map(cardPedido).join("") + "</div>"
        : '<p class="empty">Nenhum pedido aguardando. Quando um aluno solicitar, aparece aqui e o senhor recebe um e-mail, se tiver cadastrado.</p>')
      + "</div>";
  } else if (S.abaInst === "hoje") {
    corpo = '<div class="sec full"><div class="sec-h"><h2>Hoje · ' + f3(S.est.hoje) + "</h2><p>" + hojeL.length + " vistoria(s)</p></div>"
      + (hojeL.length ? '<div class="stack">' + hojeL.map(a => cardVistoria(a, true)).join("") + "</div>"
        : '<p class="empty">Nada marcado para hoje.</p>')
      + "</div>";
  } else if (S.abaInst === "agenda") {
    const prox = conf.filter(a => a.data >= S.est.hoje);
    const hist = ags.filter(a => ["entregue", "pendencias", "recusado", "cancelado"].includes(a.situacao))
      .sort((a, b) => (b.atualizadoEm || "") > (a.atualizadoEm || "") ? 1 : -1);
    corpo = '<div class="sec full"><div class="sec-h"><h2>Próximas vistorias</h2><p>' + prox.length + "</p></div>"
      + (prox.length ? '<div class="stack">' + prox.map(a => cardVistoria(a, false)).join("") + "</div>" : '<p class="empty">Nenhuma vistoria marcada.</p>')
      + "</div>"
      + '<div class="sec full"><div class="sec-h"><h2>Já resolvidas</h2><p>' + hist.length + "</p></div>"
      + (hist.length ? '<ul class="evl">' + hist.map(a =>
        "<li><b>" + esc(a.nomeGuerra) + "</b> · " + f3(a.data) + " · " + situacaoTxt(a.situacao)
        + (a.pendencias && a.pendencias.length ? "<small>Pendências: " + esc(a.pendencias.join("; ")) + "</small>" : "")
        + "</li>").join("") + "</ul>" : '<p class="empty">Nada ainda.</p>')
      + "</div>";
  } else {
    corpo = renderFerramentas(inst);
  }
  return '<div class="dash">' + erroBox() + topo + corpo + "</div>";
}

function renderOnboardingInstrutor(inst) {
  return guia("Bem-vindo, " + S.eu, "Três telas rápidas sobre como o sistema funciona para o senhor.", "")
    + '<div class="stack">'
    + '<div class="card"><strong>1. O que o senhor faz aqui</strong><p style="margin:4px 0 0;color:var(--muted)">Os seus alunos pedem horários pelo link que a coordenação mandou. O senhor <b>confirma ou recusa</b> cada pedido, e depois registra o resultado da vistoria.</p></div>'
    + '<div class="card"><strong>2. Sua disponibilidade</strong><p style="margin:4px 0 0;color:var(--muted)">O sistema só oferece aos alunos os dias em que o senhor recebe vistorias: <b>' + esc(inst.dispTexto || "período completo") + "</b>. O senhor tem <b>" + (inst.total || 0) + " alunos</b> na escala. Se a disponibilidade estiver errada, avise a coordenação.</p></div>"
    + '<div class="card"><strong>3. Lembretes</strong><p style="margin:4px 0 0;color:var(--muted)">Se o senhor cadastrar um e-mail em <b>Ferramentas</b>, recebe um aviso a cada pedido novo, o convite para pôr a vistoria na agenda do celular, e um resumo às 18 h da véspera e às 7 h do dia.</p></div>'
    + '<div class="card"><strong>Regras que o sistema já aplica sozinho</strong><ul style="margin:6px 0 0;padding-left:20px;color:var(--muted)"><li>Fins de semana, 02/11, 20/11, 25/12 e a tarde de 24/12 ficam bloqueados.</li><li>O aluno não consegue marcar no dia da viagem dele.</li><li>Abaixo de 72 h, só com o seu aval, pelo pedido de encaixe.</li><li>Nada é oferecido fora da sua disponibilidade.</li></ul></div>'
    + "</div>"
    + '<button class="btn pri big" data-act="instOk" style="margin-top:14px">Entendi, abrir meus pedidos</button>';
}

function situacaoTxt(s) {
  return ({ solicitado: "Aguardando", encaixe: "⚡ Encaixe", confirmado: "Confirmada", recusado: "Recusada", cancelado: "Cancelada", entregue: "✅ Chaves recebidas", pendencias: "⚠️ Com pendências" })[s] || s;
}

function cardPedido(a) {
  const t = tempoDe(a.tempo) || {};
  const urg = a.situacao === "encaixe";
  const horas = Math.round((new Date(a.criadoEm || Date.now()).getTime() - Date.now()) / -36e5);
  const diasViagem = a.viagem ? difDias(a.data, a.viagem) : null;
  return '<div class="ped' + (urg ? " urg" : "") + '">'
    + "<h3>" + (urg ? "⚡ ENCAIXE · " : "") + esc(a.nomeGuerra) + "</h3>"
    + '<div class="todo">' + (urg
      ? "O aluno pede um horário com menos de 72 h. Aprove só se o senhor puder atender."
      : "Confirme ou recuse. Enquanto o senhor não responder, o horário fica reservado.") + "</div>"
    + "<dl><dt>Quando</dt><dd><b>" + fw(a.data) + " · " + t.ini + " às " + t.fim + "</b></dd>"
    + "<dt>PNR</dt><dd>" + esc(a.endereco || "não informado") + "</dd>"
    + (a.viagem ? "<dt>Viagem</dt><dd>" + f3(a.viagem) + (diasViagem !== null ? " · " + (diasViagem <= 0 ? "⚠️ mesmo dia ou depois" : diasViagem === 1 ? "⚠️ só 1 dia de folga" : diasViagem + " dias de folga") : "") + "</dd>" : "")
    + (a.novaOM ? "<dt>Nova OM</dt><dd>" + esc(a.novaOM) + "</dd>" : "")
    + (a.telefone ? "<dt>WhatsApp</dt><dd>" + esc(a.telefone) + "</dd>" : "")
    + (a.justificativa ? "<dt>Justificativa</dt><dd>" + esc(a.justificativa) + "</dd>" : "")
    + "<dt>Pedido há</dt><dd>" + (horas < 1 ? "menos de 1 h" : horas + " h") + "</dd>"
    + "</dl>"
    + checklistAluno(a)
    + '<div class="acts">'
    + '<button class="btn pri" data-act="confirmar" data-id="' + a.id + '">✅ Confirmar ' + f2(a.data) + " " + t.ini + "</button>"
    + '<button class="btn" data-act="recusar" data-id="' + a.id + '">Recusar / propor outro</button>'
    + '<button class="btn" data-act="transferir" data-id="' + a.id + '">Não é meu aluno</button>'
    + "</div></div>";
}

function checklistAluno(a) {
  const c = a.checklist || {};
  const faltam = CHECK.filter(x => !c[x.k]);
  if (!Object.keys(c).length) return "";
  if (!faltam.length) return '<div class="todo" style="background:var(--ok-soft)">O aluno marcou todos os itens do checklist como prontos.</div>';
  return '<div class="todo" style="background:var(--warn-soft)">O aluno ainda não marcou: ' + esc(faltam.map(x => x.t.toLowerCase()).join(", ")) + ".</div>";
}

function cardVistoria(a, hoje) {
  const t = tempoDe(a.tempo) || {};
  const mapa = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(a.endereco || "");
  return '<div class="ped">'
    + "<h3>" + t.ini + " às " + t.fim + " · " + esc(a.nomeGuerra) + "</h3>"
    + "<dl><dt>Data</dt><dd>" + fw(a.data) + "</dd>"
    + "<dt>PNR</dt><dd>" + esc(a.endereco || "não informado") + "</dd>"
    + (a.viagem ? "<dt>Viagem do aluno</dt><dd>" + f3(a.viagem) + "</dd>" : "")
    + (a.telefone ? "<dt>WhatsApp</dt><dd>" + esc(a.telefone) + "</dd>" : "")
    + "</dl>" + checklistAluno(a)
    + '<div class="acts">'
    + '<button class="btn pri" data-act="roteiro" data-id="' + a.id + '">Fazer a vistoria (roteiro)</button>'
    + (a.endereco ? '<a class="btn" href="' + esc(mapa) + '" target="_blank" rel="noopener">Ver no mapa</a>' : "")
    + (a.telefone ? '<a class="btn" href="https://wa.me/55' + esc(String(a.telefone).replace(/\D/g, "")) + '" target="_blank" rel="noopener">💬 WhatsApp</a>' : "")
    + '<button class="btn" data-act="recusar" data-id="' + a.id + '">Cancelar vistoria</button>'
    + "</div></div>";
}

function renderFerramentas(inst) {
  const insts = S.est.instrutores || [];
  const bls = (S.est.bloqueios || []).filter(b => b.instrutor === S.eu).sort((a, b) => a.data > b.data ? 1 : -1);
  return '<div class="sec full"><div class="sec-h"><h2>Aluno esqueceu de agendar?</h2><p>Duas formas de resolver</p></div>'
    + '<div class="stack">'
    + '<div class="card"><strong>1. Marcar eu mesmo pelo aluno</strong>'
    + '<p style="margin:4px 0 0;color:var(--muted);font-size:14px">Para quem ligou ou falou pessoalmente. Já sai confirmado, sem a regra das 72 h.</p>'
    + '<button class="btn pri" data-act="agendarPor" style="margin-top:10px">Marcar por um aluno</button></div>'
    + '<div class="card"><strong>2. Liberar o aluno da regra das 72 h</strong>'

/* ===================== render: painel ===================== */

function renderPainel() {
  const ags = S.est.agendamentos || [];
  const insts = S.est.instrutores || [];
  const totalAlunos = insts.reduce((s, i) => s + (i.total || 0), 0);
  const pend = ags.filter(a => a.situacao === "solicitado" || a.situacao === "encaixe");
  const conf = ags.filter(a => a.situacao === "confirmado");
  const feitos = ags.filter(a => a.situacao === "entregue");
  const comPend = ags.filter(a => a.situacao === "pendencias");
  const vivosPorNome = {};
  ags.forEach(a => { if (["solicitado", "encaixe", "confirmado", "entregue", "pendencias"].includes(a.situacao)) vivosPorNome[normNome(a.nomeGuerra)] = a; });
  const engajados = Object.keys(vivosPorNome).length;
  const semAgendar = Math.max(0, totalAlunos - engajados);

  // Por instrutor: quantos agendaram, dias restantes e risco.
  const linhas = insts.map(i => {
    const meus = ags.filter(a => a.instrutor === i.nome && ["solicitado", "encaixe", "confirmado", "entregue", "pendencias"].includes(a.situacao));
    const ult = i.janelas && i.janelas.length ? i.janelas[i.janelas.length - 1].fim : S.est.cfg.fim;
    const rest = difDias(S.est.hoje, ult);
    const faltam = Math.max(0, (i.total || 0) - meus.length);
    const risco = faltam > 0 && rest >= 0 ? Math.round(faltam / Math.max(1, rest + 1) * 10) / 10 : 0;
    return { i, n: meus.length, faltam, ult, rest, risco, entregues: meus.filter(a => a.situacao === "entregue").length };
  }).sort((a, b) => b.risco - a.risco || a.rest - b.rest);

  const emRisco = linhas.filter(l => l.faltam > 0 && l.rest >= 0 && (l.rest <= 10 || l.risco >= 1.5));

  const pendAntigos = pend.filter(a => (Date.now() - new Date(a.criadoEm || Date.now()).getTime()) > 24 * 36e5);

  const dias = {};
  conf.concat(feitos).forEach(a => { dias[a.data] = (dias[a.data] || 0) + 1; });
  const maxDia = Math.max(1, ...Object.values(dias));

  const mesesL = mesesDaCampanha();
  if (!S.mes || !mesesL.some(m => m.ym === S.mes)) S.mes = mesesL[0] ? mesesL[0].ym : null;
  const diasMes = S.mes ? diasDoMes(S.mes) : [];
  const primeiro = diasMes.length ? wd(diasMes[0]) : 0;
  const heatCels = [];
  for (let k = 0; k < primeiro; k++) heatCels.push("<div style=\"background:transparent;border:0\"></div>");
  diasMes.forEach(d => {
    const n = dias[d] || 0;
    const h = Math.round(n / maxDia * 85);
    heatCels.push('<div style="--h:' + h + '%"' + (h > 55 ? ' class="hot"' : "") + ">"
      + (+d.slice(8, 10)) + (n ? "<b>" + n + "</b>" : "") + "</div>");
  });

  return '<div class="dash">' + erroBox()
    + '<div class="sec full">' + guia("Painel da coordenação",
      "Acompanhe a campanha e cobre quem está atrasado. Cada alerta já vem com o que fazer.",
      "")
    + '<div class="kpis">'
    + '<div class="kpi"><div class="v">' + totalAlunos + '</div><div class="l">alunos na escala</div></div>'
    + '<div class="kpi bad"><div class="v">' + semAgendar + '</div><div class="l">ainda sem agendar</div></div>'
    + '<div class="kpi warn"><div class="v">' + pend.length + '</div><div class="l">pedidos aguardando instrutor</div></div>'
    + '<div class="kpi ok"><div class="v">' + feitos.length + '</div><div class="l">chaves recebidas</div></div>'
    + "</div>"
    + '<div class="kpis" style="margin-top:8px">'
    + '<div class="kpi"><div class="v">' + conf.length + '</div><div class="l">vistorias confirmadas</div></div>'
    + '<div class="kpi bad"><div class="v">' + comPend.length + '</div><div class="l">com pendências a corrigir</div></div>'
    + '<div class="kpi warn"><div class="v">' + pendAntigos.length + '</div><div class="l">pedidos há mais de 24 h</div></div>'
    + '<div class="kpi pend"><div class="v">' + Math.round(feitos.length / Math.max(1, totalAlunos) * 100) + '%</div><div class="l">da campanha concluída</div></div>'
    + "</div></div>"

    + '<div class="sec full"><div class="sec-h"><h2>O que precisa de ação agora</h2></div>'
    + (emRisco.length || pendAntigos.length
      ? emRisco.map(l =>
        '<div class="alerta ' + (l.rest <= 5 ? "b" : "w") + '"><b>' + esc(l.i.nome) + ": disponibilidade termina em " + l.rest + " dia(s), em " + f3(l.ult) + "</b>"
        + "<span>" + l.faltam + " de " + l.i.total + " alunos dele ainda não agendaram. Cobre a turma hoje; depois dessa data ele não recebe mais vistorias.</span>"
        + '<div class="row-btns"><button class="btn sm" data-act="cobrar" data-n="' + esc(l.i.nome) + '">Mensagem pronta para cobrar</button></div></div>').join("")
        + (pendAntigos.length ? '<div class="alerta w"><b>' + pendAntigos.length + " pedido(s) sem resposta há mais de 24 h</b><span>"
          + esc(pendAntigos.map(a => a.nomeGuerra + " → " + a.instrutor).join("; ")) + ". Avise os instrutores.</span></div>" : "")
      : '<p class="empty">Nada urgente. Todos os instrutores estão com folga de prazo e os pedidos estão sendo respondidos.</p>')
    + "</div>"

    + '<div class="sec full"><div class="sec-h"><h2>Por instrutor</h2><p>Agendados sobre o total da escala</p></div>'
    + '<table class="tbl"><thead><tr><th>Instrutor</th><th class="num">Agendados</th><th>Progresso</th><th class="num">Entregues</th><th>Disponível até</th><th class="num">Dias</th></tr></thead><tbody>'
    + linhas.map(l => "<tr><td><b>" + esc(l.i.nome) + "</b><br><small style=\"color:var(--muted)\">" + esc(l.i.dispTexto) + "</small></td>"
      + '<td class="num">' + l.n + "/" + l.i.total + "</td>"
      + '<td><div class="bar2"><i style="width:' + Math.round(l.n / Math.max(1, l.i.total) * 100) + '%"></i></div></td>'
      + '<td class="num">' + l.entregues + "</td>"
      + "<td>" + f3(l.ult) + "</td>"
      + '<td class="num">' + (l.rest < 0 ? "encerrado" : l.rest) + "</td></tr>").join("")
    + "</tbody></table></div>"

    + '<div class="sec"><div class="sec-h"><h2>Ocupação por dia</h2><p>Vistorias marcadas e realizadas</p></div>'
    + '<div class="mtabs" role="group">' + mesesL.map(m =>
      '<button data-act="mes" data-v="' + m.ym + '" aria-pressed="' + (S.mes === m.ym) + '">' + m.curto + "</button>").join("") + "</div>"
    + '<div class="wk" style="margin-top:10px">' + WD_CURTO.map(w => "<span>" + w + "</span>").join("") + "</div>"
    + '<div class="heat">' + heatCels.join("") + "</div>"
    + '<p class="hint" style="margin-top:10px">Cada dia tem 6 tempos por instrutor: 3 de manhã e 3 de tarde.</p></div>'

    + '<div class="sec"><div class="sec-h"><h2>Últimos movimentos</h2></div>'
    + (ags.length ? '<ul class="evl">' + ags.slice().sort((a, b) => (b.atualizadoEm || "") > (a.atualizadoEm || "") ? 1 : -1).slice(0, 14).map(a =>
      "<li><b>" + esc(a.nomeGuerra) + "</b> · " + esc(a.instrutor) + " · " + f3(a.data)
      + "<small>" + situacaoTxt(a.situacao) + (a.pendencias && a.pendencias.length ? " · " + esc(a.pendencias.join("; ")) : "") + "</small></li>").join("") + "</ul>"
      : '<p class="empty">Nenhum agendamento ainda.</p>')
    + "</div></div>";
}

  const txt = "Senhores, a disponibilidade do " + nome + " para receber PNR vai até " + f3(inst.janelas && inst.janelas.length ? inst.janelas[inst.janelas.length - 1].fim : S.est.cfg.fim)
    + ". Quem ainda não agendou a vistoria, faça hoje pelo link. Lembrem-se: antecedência mínima de 72 h, nunca no dia do voo, entrega pessoal e sem acompanhante.";
  modal("Mensagem pronta para cobrar",
    '<p class="hint">Copie e mande no grupo da turma.</p>'
    + '<div class="card" style="font-size:14px" id="msgcobrar">' + esc(txt) + "</div>",
    '<a class="btn pri" href="https://wa.me/?text=' + encodeURIComponent(txt) + '" target="_blank" rel="noopener">Abrir no WhatsApp</a>'
    + '<button class="btn" data-act="copiar">Copiar texto</button>');
}

/** Arquivo .ics para o aluno pôr a vistoria na agenda do celular. */
function baixarIcs() {
  const a = S.meu, t = tempoDe(a.tempo);
  const z = d => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const ics = [
    "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//EsAO//PNR//PT-BR", "BEGIN:VEVENT",
    "UID:pnr-" + a.id + "@esao", "DTSTAMP:" + z(new Date()),
    "DTSTART:" + z(horaDe(a.data, t.ini)), "DTEND:" + z(horaDe(a.data, t.fim)),
    "SUMMARY:Entrega do PNR - vistoria com " + a.instrutor,
    "LOCATION:" + String(a.endereco || "").replace(/,/g, "\\,"),
    "DESCRIPTION:Levar TODAS as chaves e copias\\, controles\\, comprovantes da Light e da Naturgy e copia do Termo de Recebimento. Comparecer pessoalmente e sozinho.",
    "BEGIN:VALARM", "TRIGGER:-PT2H", "ACTION:DISPLAY", "DESCRIPTION:Vistoria do PNR em 2 horas", "END:VALARM",
    "BEGIN:VALARM", "TRIGGER:-P1D", "ACTION:DISPLAY", "DESCRIPTION:Vistoria do PNR amanha", "END:VALARM",
    "END:VEVENT", "END:VCALENDAR"
  ].join("\r\n");
  try {
    const url = URL.createObjectURL(new Blob([ics], { type: "text/calendar" }));
    const link = document.createElement("a");
    link.href = url; link.download = "vistoria-pnr.ics";
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    toast("Abra o arquivo baixado para pôr na sua agenda.");
  } catch (e) { toast("Não foi possível gerar o arquivo neste aparelho."); }
}

/* ===================== eventos ===================== */

document.addEventListener("input", e => {
  const b = e.target.getAttribute && e.target.getAttribute("data-bind");
  if (!b) return;
  S.dados[b] = e.target.value;
  salvarLocal();
  // Não re-renderiza: isso tiraria o foco do campo. O botão atualiza ao tocar.
  if (b === "nomeGuerra" || b === "assinatura" || b === "endereco" || b === "viagem") {
    const nb = document.querySelector(".navbar .btn.pri");
    if (nb) nb.disabled = !podeAvancar();
  }
});

function podeAvancar() {
  if (S.step === 1) return S.dados.nomeGuerra.trim().length >= 3 && !!S.dados.instrutor;
  if (S.step === 2) return S.rolouTermo && CRITICOS.every(c => S.aceites[c.k]) && S.aceiteGeral
    && normNome(S.dados.assinatura || "") === normNome(S.dados.nomeGuerra);
  if (S.step === 4) return (S.dados.endereco || "").trim().length >= 8 && !!S.dados.viagem;
  return true;
}

document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.getAttribute("data-act");
  const v = el.getAttribute("data-v"), k = el.getAttribute("data-k"), id = el.getAttribute("data-id");
  const d = el.getAttribute("data-d"), n = el.getAttribute("data-n"), i = el.getAttribute("data-i");

  // fechar modal tocando no fundo
  if (act === "fundo") { if (e.target === el) fecharModal(); return; }
  if (act === "fechar") { fecharModal(); return; }

  switch (act) {
    case "view": S.view = v; S.erro = ""; render(); return;
    case "aba": S.abaInst = v; S.erro = ""; render(); return;
    case "mes": S.mes = v; render(); return;
    case "ajuda": modalAjuda(); return;
    case "recarregar": await carregar(); toast("Atualizado."); return;
    case "instOk": try { localStorage.setItem("pnr-inst-ok", "1"); } catch (x) {} render(); return;

    case "step": case "go": {
      const alvo = Number(i);
      if (isNaN(alvo)) return;
      if (alvo > S.step && !podeAvancar()) return;
      if (S.step === 2 && alvo === 3) {
        // registra o aceite no momento em que o aluno assina
        await acao("aceitarTermos", S.dados.nomeGuerra, S.dados.instrutor,
          CRITICOS.map(c => c.t).concat(["Termo completo"]));
      }
      S.step = Math.max(0, Math.min(STEPS.length - 1, alvo));
      S.erro = ""; window.scrollTo(0, 0); render(); return;
    }
    case "inst": S.dados.instrutor = n; S.dia = null; salvarLocal(); render(); return;
    case "crit": S.aceites[k] = !S.aceites[k]; salvarLocal(); render(); return;
    case "geral": S.aceiteGeral = !S.aceiteGeral; salvarLocal(); render(); return;
    case "check": S.checklist[k] = !S.checklist[k]; salvarLocal(); render(); return;
    case "howto": S.abertos[k] = !S.abertos[k]; render(); return;
    case "verCheck": S.verCheck = true; window.scrollTo(0, 0); render(); return;
    case "voltarStatus": S.verCheck = false; window.scrollTo(0, 0); render(); return;
    case "dia": S.dia = d; render(); return;
    case "porque": {
      const m = motivo(S.est, S.dados.instrutor, S.dia, k, { viagem: S.dados.viagem });
      modalPorque(m.txt || "Horário indisponível.");
      return;
    }
    case "encaixe": modalEncaixe(k); return;
    case "pedir": modalConfirmarPedido(k); return;

    case "enviarPedido": case "enviarEncaixe": {
      const just = document.getElementById("just");
      const r = await acao("solicitar", {
        nomeGuerra: S.dados.nomeGuerra, instrutor: S.dados.instrutor, data: S.dia, tempo: k,
        endereco: S.dados.endereco, viagem: S.dados.viagem, novaOM: S.dados.novaOM,
        telefone: S.dados.telefone, email: S.dados.email, checklist: S.checklist,
        aceitou: true, encaixe: act === "enviarEncaixe", justificativa: just ? just.value : ""
      });
      fecharModal();
      if (r && r.ok) { toast(act === "enviarEncaixe" ? "Pedido de encaixe enviado." : "Pedido enviado ao instrutor."); await carregar(); window.scrollTo(0, 0); }
      return;
    }
    case "cancelar": modalCancelar(); return;
    case "enviarCancelar": {
      const nome = document.getElementById("cnome").value;
      const mot = document.getElementById("cmot").value;
      const r = await acao("cancelar", S.meu.id, nome, mot);
      if (r && r.ok) { fecharModal(); toast("Vistoria cancelada."); S.meu = null; S.step = 5; await carregar(); }
      else if (S.erro) { fecharModal(); render(); }
      return;
    }
    case "remarcar": modalRemarcar(); return;
    case "enviarRemarcar": {
      const nome = document.getElementById("rn").value;
      const dia = document.getElementById("rd").value;
      const tmp = document.getElementById("rt").value;
      if (!dia) { toast("Escolha um dia livre."); return; }
      const r = await acao("remarcar", S.meu.id, nome, dia, tmp);
      if (r && r.ok) { fecharModal(); toast("Nova vistoria solicitada."); await carregar(); }
      else if (S.erro) { fecharModal(); render(); }
      return;
    }
    case "ics": baixarIcs(); return;
    case "zap": {
      const txt = "Senhor " + (S.meu ? S.meu.instrutor : S.dados.instrutor) + ", sou o " + (S.meu ? S.meu.nomeGuerra : S.dados.nomeGuerra)
        + ". Falo sobre a vistoria do meu PNR" + (S.meu ? " marcada para " + f3(S.meu.data) : "") + ".";
      window.open("https://wa.me/?text=" + encodeURIComponent(txt), "_blank");
      return;
    }

    /* --- instrutor --- */
    case "confirmar": {
      const r = await acao("confirmar", S.chave, id);
      if (r && r.ok) { toast("Confirmada. O aluno já vê na tela dele."); await carregar(); }
      return;
    }
    case "recusar": modalRecusar(id); return;
    case "enviarRecusar": {
      const r = await acao("recusar", S.chave, id, document.getElementById("rmot").value, document.getElementById("rsug").value);
      if (r && r.ok) { fecharModal(); toast("Recusada. O aluno foi avisado."); await carregar(); }
      return;
    }
    case "transferir": modalTransferir(id); return;
    case "enviarTransferir": {
      const r = await acao("transferir", S.chave, id, document.getElementById("tdest").value);
      if (r && r.ok) { fecharModal(); toast("Transferida."); await carregar(); }
      return;
    }
    case "roteiro": modalRoteiro(id); return;
    case "rot": {
      const rid = S.roteiroId;
      S.roteiro[rid] = S.roteiro[rid] || {};
      S.roteiro[rid][k] = S.roteiro[rid][k] === v ? null : v;
      const obs = document.getElementById("robs");
      const guardado = obs ? obs.value : "";
      modalRoteiro(rid);
      const novo = document.getElementById("robs");
      if (novo) novo.value = guardado;
      return;
    }
    case "regOk": {
      const obs = document.getElementById("robs");
      const r = await acao("registrarResultado", S.chave, id, true, [], obs ? obs.value : "");
      if (r && r.ok) { fecharModal(); toast("Chaves recebidas. Processo encerrado."); await carregar(); }
      return;
    }
    case "regPend": {
      const rid = S.roteiro[id] || {};
      const lista = ROTEIRO.filter(x => rid[x.k] === "n").map(x => x.t);
      const obs = document.getElementById("robs");
      const r = await acao("registrarResultado", S.chave, id, false, lista, obs ? obs.value : "");
      if (r && r.ok) { fecharModal(); toast("Pendências registradas. O aluno recebeu a lista."); await carregar(); }
      return;
    }
    case "bloquear": modalBloquear(); return;
    case "enviarBloqueio": {
      const dia = document.getElementById("bd").value;
      if (!dia) { toast("Escolha o dia."); return; }
      const r = await acao("bloquear", S.chave, dia, document.getElementById("bt").value, document.getElementById("bm").value);
      if (r && r.ok) { fecharModal(); toast("Horário bloqueado."); await carregar(); }
      else if (S.erro) { fecharModal(); render(); }
      return;
    }
    case "desbloquear": {
      const r = await acao("desbloquear", S.chave, d, k);
      if (r && r.ok) { toast("Horário liberado."); await carregar(); }
      return;
    }
    case "excecao": modalExcecao(); return;
    case "enviarExcecao": {
      const r = await acao("liberarExcecao", S.chave, document.getElementById("xn").value, document.getElementById("xd").value);
      if (r && r.ok) { fecharModal(); toast("Exceção liberada até " + f3(r.validaAte) + "."); await carregar(); }
      return;
    }
    case "agendarPor": modalAgendarPor(); return;
    case "enviarAgendarPor": {
      const r = await acao("agendarPeloInstrutor", S.chave, {
        nomeGuerra: document.getElementById("an").value,
        endereco: document.getElementById("ae").value,
        data: document.getElementById("ad").value,
        tempo: document.getElementById("at").value,
        viagem: document.getElementById("av").value
      });
      if (r && r.ok) { fecharModal(); toast("Vistoria marcada e confirmada."); await carregar(); }
      else if (S.erro) { fecharModal(); render(); }
      return;
    }
    case "salvarEmail": {
      const em = document.getElementById("eminst").value;
      const r = await acao("salvarEmail", S.chave, em);
      if (r && r.ok) { toast("E-mail salvo. O senhor passa a receber os lembretes."); await carregar(); }
      return;
    }

    /* --- painel --- */
    case "cobrar": modalCobrar(n); return;
    case "copiar": {
      const t = document.getElementById("msgcobrar");
      if (t) {
        try { await navigator.clipboard.writeText(t.textContent); toast("Texto copiado."); }
        catch (x) { toast("Selecione e copie o texto à mão."); }
      }
      return;
    }
  }
});

document.addEventListener("keydown", e => { if (e.key === "Escape") fecharModal(); });
