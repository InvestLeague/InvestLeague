<title>Formulário de Afastamentos EsAO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: uma coluna estreita para o formulário (celular primeiro); o painel abre em grade de duas colunas a partir de 960px. */
:root {
  --bg: #f1f3ef;
  --surface: #ffffff;
  --surface-2: #e8ebe5;
  --ink: #15201a;
  --muted: #56615a;
  --line: #d3d9d1;
  --accent: #2c5a37;
  --accent-ink: #ffffff;
  --accent-soft: #dce9df;
  --heat: #2c5a37;
  --ok: #1a7a2a; --ok-soft: #dff1e1;
  --warn: #8a5a00; --warn-soft: #fcefd2;
  --bad: #b3261e; --bad-soft: #fbe2df;
  --pend: #5b5f6b; --pend-soft: #e7e8ec;
  --focus: #1f6feb;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Public Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

  --c-ferias26: #2a78d6;  --t-ferias26: #ffffff;
  --c-feriasant: #4a3aa7; --t-feriasant: #ffffff;
  --c-natal: #e34948;     --t-natal: #ffffff;
  --c-anonovo: #eda100;   --t-anonovo: #1b1300;
  --c-instalacao: #1baf7a;--t-instalacao: #04231a;
  --c-dispcmt: #eb6834;   --t-dispcmt: #1e0a00;
  --c-curso: #008300;     --t-curso: #ffffff;
  --c-missao: #e87ba4;    --t-missao: #2a0716;
  --c-licenca: #8a6d3b;   --t-licenca: #ffffff;
  --c-outro: #6b7570;     --t-outro: #ffffff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1311; --surface: #181d1a; --surface-2: #222924; --ink: #ecf0ea; --muted: #a2ada5; --line: #303833;
    --accent: #86c495; --accent-ink: #0d1a10; --accent-soft: #23382a; --heat: #86c495;
    --ok: #6fd07c; --ok-soft: #1d3322; --warn: #f1bf55; --warn-soft: #3a2f14; --bad: #ff8a80; --bad-soft: #3d1f1c; --pend: #b8bcc8; --pend-soft: #2a2c33; --focus: #7aa8ff;
    --c-ferias26: #3987e5; --c-feriasant: #9085e9; --t-feriasant: #120c35; --c-natal: #e66767; --c-anonovo: #c98500;
    --c-instalacao: #199e70; --c-dispcmt: #d95926; --c-curso: #008300; --c-missao: #d55181; --c-licenca: #a88a55; --t-licenca: #1c1406; --c-outro: #7f8a84;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1311; --surface: #181d1a; --surface-2: #222924; --ink: #ecf0ea; --muted: #a2ada5; --line: #303833;
  --accent: #86c495; --accent-ink: #0d1a10; --accent-soft: #23382a; --heat: #86c495;
  --ok: #6fd07c; --ok-soft: #1d3322; --warn: #f1bf55; --warn-soft: #3a2f14; --bad: #ff8a80; --bad-soft: #3d1f1c; --pend: #b8bcc8; --pend-soft: #2a2c33; --focus: #7aa8ff;
  --c-ferias26: #3987e5; --c-feriasant: #9085e9; --t-feriasant: #120c35; --c-natal: #e66767; --c-anonovo: #c98500;
  --c-instalacao: #199e70; --c-dispcmt: #d95926; --c-curso: #008300; --c-missao: #d55181; --c-licenca: #a88a55; --t-licenca: #1c1406; --c-outro: #7f8a84;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 var(--f-body); margin: 0; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: .01em; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- topo ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1240px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 200px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.brand h1 { font-size: 22px; line-height: 1.1; font-weight: 700; }
.views { display: flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.views button { border: 0; background: transparent; padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.views button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; width: 100%; }
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--pend); display: inline-block; flex: none; }
.conn.on i { background: var(--ok); }
.conn.off i { background: var(--bad); }
.banner { max-width: 1240px; margin: 12px auto 0; padding: 0 16px; }
.banner > div { border-radius: 10px; padding: 10px 12px; font-size: 14px; border: 1px solid var(--line); background: var(--surface); }
.banner .w { background: var(--warn-soft); border-color: transparent; }
.banner .b { background: var(--bad-soft); border-color: transparent; }

/* ---------- formulário ---------- */
.form-wrap { max-width: 620px; margin: 0 auto; padding: 16px 16px 120px; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 18px; }
.steps button { border: 0; background: none; padding: 0; text-align: left; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.steps button:disabled { cursor: default; }
.steps .bar { height: 4px; border-radius: 2px; background: var(--line); }
.steps .on .bar, .steps .done .bar { background: var(--accent); }
.steps .lbl { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps .on .lbl { color: var(--ink); font-weight: 700; }
.q { font-size: 28px; font-weight: 700; line-height: 1.1; margin-bottom: 6px; }
.hint { color: var(--muted); margin: 0 0 16px; max-width: 60ch; }
.names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.name-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 64px; }
.name-btn strong { font-size: 16px; }
.name-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; border-radius: 999px; padding: 1px 8px; width: fit-content; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.pend { background: var(--pend-soft); color: var(--pend); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.opts { display: grid; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px 14px; text-align: left; display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; align-items: start; }
.opt .radio { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--muted); margin-top: 1px; display: grid; place-items: center; }
.opt[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.opt[aria-checked="true"] .radio { border-color: var(--accent); }
.opt[aria-checked="true"] .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.opt strong { font-size: 16px; }
.opt small { grid-column: 2; color: var(--muted); font-size: 13px; }
.opt .extra { grid-column: 2; }
.cats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cat-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px; text-align: left; display: flex; gap: 8px; align-items: flex-start; min-height: 56px; font-weight: 600; font-size: 14px; line-height: 1.25; }
.cat-btn small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.cat-btn[aria-checked="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.sw { width: 14px; height: 14px; border-radius: 4px; flex: none; margin-top: 2px; background: var(--c); }
.sw.tex, .bar-tex { background-image: repeating-linear-gradient(45deg, rgb(255 255 255 / .38) 0 3px, transparent 3px 7px); }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
.stack { display: grid; gap: 10px; }
.per { display: grid; grid-template-columns: 6px 1fr auto; gap: 10px; align-items: start; }
.per .stripe { align-self: stretch; border-radius: 3px; background: var(--c); }
.per h3 { font-family: var(--f-body); font-size: 15px; font-weight: 700; }
.per p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
.per .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-weight: 600; font-size: 14px; }
.btn.sm { padding: 6px 10px; font-size: 13px; }
.btn.pri { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); }
.btn.big { width: 100%; padding: 14px; font-size: 16px; border-radius: 12px; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.add { border: 2px dashed var(--line); background: transparent; border-radius: 14px; padding: 14px; font-weight: 700; color: var(--accent); width: 100%; font-size: 15px; }
.lock { font-size: 12px; color: var(--muted); }
.field { display: grid; gap: 6px; margin-top: 14px; }
.field label, .lab { font-weight: 700; font-size: 14px; }
.field input[type=text] { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 12px; width: 100%; }

.issues { display: grid; gap: 8px; margin-top: 14px; }
.issue { border-radius: 10px; padding: 10px 12px; font-size: 14px; display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; }
.issue b { font-weight: 700; }
.issue.conflito, .issue.incompleto { background: var(--bad-soft); }
.issue.conflito .ic, .issue.incompleto .ic { color: var(--bad); }
.issue.aviso { background: var(--warn-soft); }
.issue.aviso .ic { color: var(--warn); }
.issue.okay { background: var(--ok-soft); }
.issue.okay .ic { color: var(--ok); }
.ic { font-weight: 800; font-size: 15px; line-height: 1.3; }
.issue .go { margin-top: 6px; }
.rule { background: var(--accent-soft); border-radius: 12px; padding: 12px 14px; font-size: 14px; margin-bottom: 14px; }
.rule strong { display: block; margin-bottom: 4px; }

.navbar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 15; }
.navbar-in { max-width: 620px; margin: 0 auto; display: flex; gap: 10px; }
.navbar .btn { flex: 1; padding: 13px; font-size: 16px; }

/* ---------- calendário de seleção ---------- */
.cal { margin-top: 10px; }
.mtabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); padding: 3px; border-radius: 10px; }
.mtabs button { border: 0; background: transparent; padding: 8px 4px; border-radius: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.mtabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.wk, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.wk { margin: 10px 0 4px; }
.wk span { font-size: 11px; text-align: center; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.day { position: relative; border: 0; background: var(--surface); border-radius: 8px; aspect-ratio: 1 / 1; max-width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 600; font-variant-numeric: tabular-nums; font-size: 15px; padding: 0; }
.day.blank { background: transparent; }
.day.we { color: var(--muted); }
.day.fer .dn { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
.day.in { background: var(--accent-soft); }
.day.edge { background: var(--accent); color: var(--accent-ink); }
.day .marks { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; }
.day .marks i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.day:disabled { opacity: .35; cursor: default; }
.picksum { margin-top: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.picksum div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.picksum b { display: block; font-size: 15px; }
.picksum .cur { box-shadow: 0 0 0 2px var(--accent) inset; }

/* faixa resumo individual */
.strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.strip .m { min-width: 0; }
.strip .m span { font-size: 11px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }
.strip .t { position: relative; height: 22px; background: var(--surface-2); border-radius: 5px; overflow: hidden; }
.strip .t b { position: absolute; top: 0; bottom: 0; background: var(--c); }
.strip .t .gone { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(135deg, var(--line) 0 3px, transparent 3px 6px); }

/* ---------- painel ---------- */
.dash { max-width: 1240px; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.kpi .v { font-family: var(--f-display); font-size: 34px; font-weight: 700; line-height: 1; }
.kpi .l { font-size: 13px; color: var(--muted); }
.kpi.ok .v { color: var(--ok); } .kpi.bad .v { color: var(--bad); } .kpi.pend .v { color: var(--pend); }
.kpi button { all: unset; cursor: pointer; display: block; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sec-h h2 { font-size: 22px; font-weight: 700; }
.sec-h p { margin: 0; color: var(--muted); font-size: 13px; }
.filters { display: grid; gap: 10px; }
.filters select { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 10px; width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 10px 5px 8px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; font-weight: 500; }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--surface-2); font-weight: 700; }
.chip[aria-pressed="false"] .sw { opacity: .3; }
.chip .chk { width: 12px; font-weight: 800; }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }

.dcal .day { aspect-ratio: auto; min-height: 62px; justify-content: flex-start; align-items: stretch; padding: 4px 4px 5px; background: color-mix(in srgb, var(--heat) var(--h, 0%), var(--surface)); border: 1px solid var(--line); text-align: left; }
.dcal .day .dn { font-size: 13px; }
.dcal .day .cnt { margin-top: auto; font-size: 11px; font-weight: 600; line-height: 1.15; }
.dcal .day .cnt b { font-family: var(--f-display); font-size: 19px; display: block; }
.dcal .day.hot { color: var(--accent-ink); }
.dcal .day.hot .dn, .dcal .day.hot .cnt { color: var(--accent-ink); }
.dcal .day.sel { outline: 3px solid var(--ink); outline-offset: -1px; z-index: 1; }
.dcal .day.rng { box-shadow: 0 0 0 2px var(--ink) inset; }
.dcal .day .cats-m { display: flex; gap: 2px; height: 5px; margin-top: 3px; }
.dcal .day .cats-m i { flex: 1; border-radius: 2px; background: var(--c); }
.dcal .day .flags { position: absolute; top: 3px; right: 4px; font-size: 11px; font-weight: 800; letter-spacing: .02em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.heatkey { display: inline-flex; gap: 2px; }
.heatkey i { width: 14px; height: 10px; border-radius: 2px; background: color-mix(in srgb, var(--heat) var(--h), var(--surface)); border: 1px solid var(--line); }

.detail h3 { font-family: var(--f-display); font-size: 24px; font-weight: 700; }
.mini { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin: 10px 0; }
.mini div { background: var(--surface-2); border-radius: 10px; padding: 6px 8px; min-width: 0; }
.mini b { font-family: var(--f-display); font-size: 24px; display: block; line-height: 1.05; }
.mini span { font-size: 12px; color: var(--muted); }
.grp { margin-top: 12px; }
.grp h4 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.who { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.who li { display: grid; grid-template-columns: 1fr; gap: 2px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
.who li strong { font-weight: 700; }
.who .why { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--muted); }
.who .why span { display: inline-flex; gap: 5px; align-items: center; }
.names-inline { display: flex; flex-wrap: wrap; gap: 6px; }
.names-inline span { background: var(--surface-2); border-radius: 8px; padding: 4px 8px; font-size: 13px; font-weight: 600; }
.peak { display: flex; align-items: flex-end; gap: 1px; height: 60px; margin: 8px 0 2px; }
.peak i { flex: 1; background: var(--heat); border-radius: 2px 2px 0 0; min-height: 1px; opacity: .85; }
.peak i.mx { opacity: 1; background: var(--bad); }
.peak-ax { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }

/* mapa (gantt) */
.map { display: grid; gap: 0; }
.map .row { display: grid; grid-template-columns: 96px minmax(0, 1fr); align-items: center; gap: 8px; padding: 3px 0; border: 0; background: none; text-align: left; width: 100%; }
.map .row:hover .trk { box-shadow: 0 0 0 1px var(--muted) inset; }
.map .nm { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.map .nm small { display: block; font-weight: 500; font-size: 11px; }
.trk { position: relative; height: 30px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.trk .wkend { position: absolute; top: 0; bottom: 0; background: rgb(0 0 0 / .045); }
.trk .seldayl { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--ink); z-index: 3; margin-left: -1px; }
.trk .bar { position: absolute; top: 3px; bottom: 3px; background: var(--c); color: var(--t); border-radius: 4px; font-size: 11px; font-weight: 700; padding: 0 4px; display: flex; align-items: center; overflow: hidden; white-space: nowrap; z-index: 1; }
.trk .bar span { overflow: hidden; text-overflow: ellipsis; }
.trk .bar.dim { opacity: .18; }
.trk .apr { position: absolute; top: 0; bottom: 0; width: 0; border-left: 2px dashed var(--ink); z-index: 2; }
.trk .dsl { position: absolute; top: 0; bottom: 0; right: 0; background: repeating-linear-gradient(135deg, var(--muted) 0 2px, transparent 2px 6px); opacity: .55; z-index: 2; }
.trk .pend { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--pend); background: repeating-linear-gradient(45deg, var(--pend-soft) 0 6px, transparent 6px 12px); }
.trk .badrow { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); z-index: 4; }
.axis { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; margin-bottom: 4px; }
.axis .ticks { position: relative; height: 16px; font-size: 11px; color: var(--muted); }
.axis .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; font-variant-numeric: tabular-nums; }
.axis .ticks span.l0 { transform: none; }

.status-cols { display: grid; gap: 12px; }
.st-item { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px; border-radius: 10px; background: var(--surface-2); align-items: center; }

<script>
"use strict";
/* AVULSO = true gera o formulário sem login (formulario.html): sem base de dados; a resposta vira uma mensagem com código que o gestor importa no painel. */
const AVULSO = true;
/* ======================= dados fixos ======================= */
const MILITARES = [
  ["barroso-magno", "Maj Barroso Magno"], ["modesto", "Maj Modesto"], ["andrews", "Maj Andrews"],
  ["pimenta", "Maj Pimenta"], ["aredes", "Maj Arêdes"], ["calderaro", "Cap Calderaro"],
  ["cesse", "Cap Cesse"], ["dantas", "Cap Dantas"], ["loan", "Cap Loan"], ["santana", "Cap Santana"],
  ["uerlei-moreira", "Cap Uerlei Moreira"], ["cavalcanti", "Cap Cavalcanti"], ["marcello", "Cap Marcello"]
].map(([id, nome]) => ({ id, nome }));
const NOME = Object.fromEntries(MILITARES.map(m => [m.id, m.nome]));

const CATS = [
  { k: "ferias26", n: "Férias 2026" },
  { k: "feriasant", n: "Férias de ano anterior" },
  { k: "natal", n: "Dispensa de Natal", fixa: true },
  { k: "anonovo", n: "Dispensa de Ano-Novo", fixa: true },
  { k: "instalacao", n: "Instalação" },
  { k: "dispcmt", n: "Dispensa Cmt EsAO" },
  { k: "curso", n: "Curso/estágio" },
  { k: "missao", n: "Missão/serviço fora da EsAO" },
  { k: "licenca", n: "Licença/afastamento já previsto", tex: true },
  { k: "outro", n: "Outro afastamento autorizado", tex: true }
];
const CAT = Object.fromEntries(CATS.map(c => [c.k, c]));

const INI = "2026-11-01", FIM = "2027-01-31";
const DISP = {
  natal:   { ini: "2026-12-23", fim: "2026-12-28", apres: "2026-12-29", n: "Dispensa de Natal" },
  anonovo: { ini: "2026-12-30", fim: "2027-01-04", apres: "2027-01-05", n: "Dispensa de Ano-Novo" }
};
const FERIADOS = {
  "2026-11-02": "Finados", "2026-11-15": "Proclamação da República",
  "2026-11-20": "Dia Nacional de Zumbi e da Consciência Negra", "2026-12-25": "Natal",
  "2027-01-01": "Confraternização Universal"
};
const MESES = [
  { y: 2026, m: 10, n: "Novembro", c: "Nov" }, { y: 2026, m: 11, n: "Dezembro", c: "Dez" }, { y: 2027, m: 0, n: "Janeiro", c: "Jan" }
];
const WD = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
const STEPS = ["Nome", "Afastamentos", "Dispensa", "Desligamento", "Resumo"];

/* ======================= datas ======================= */
const dn = s => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const ds = n => new Date(n * 864e5).toISOString().slice(0, 10);
const add = (s, k) => ds(dn(s) + k);
const wd = s => new Date(dn(s) * 864e5).getUTCDay();
const f2 = s => s.slice(8, 10) + "/" + s.slice(5, 7);
const f3 = s => f2(s) + "/" + s.slice(0, 4);
const fw = s => f3(s) + " (" + WD[wd(s)] + ")";
const fs = s => f2(s) + " " + WD[wd(s)];
const ndias = (a, b) => dn(b) - dn(a) + 1;
const ALL_DAYS = (() => { const r = []; for (let n = dn(INI); n <= dn(FIM); n++) r.push(ds(n)); return r; })();
const mesDias = (mi) => ALL_DAYS.filter(d => +d.slice(5, 7) - 1 === MESES[mi].m && +d.slice(0, 4) === MESES[mi].y);
const fmtHora = iso => { try { const d = new Date(iso); return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " às " + d.toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 9);
const clone = o => JSON.parse(JSON.stringify(o));
const rangeTxt = (a, b) => a === b ? f3(a) + " (" + WD[wd(a)] + ") · 1 dia" : fw(a) + " a " + fw(b) + " · " + ndias(a, b) + " dias";

/* ======================= regras ======================= */
const valido = p => p && CAT[p.cat] && p.ini && p.fim && p.ini <= p.fim;
const sobrepoe = (a, b) => a.ini <= b.fim && b.ini <= a.fim;
const intersec = (a, b) => ({ ini: a.ini > b.ini ? a.ini : b.ini, fim: a.fim < b.fim ? a.fim : b.fim });
const intTxt = r => r.ini === r.fim ? f2(r.ini) : f2(r.ini) + " a " + f2(r.fim);

/** Todos os afastamentos de uma resposta, incluindo a dispensa de fim de ano (datas fixas). */
function afastamentos(rec) {
  const out = (rec.periodos || []).map((p, i) => ({ ...p, idx: i + 1 }));
  if (rec.dispensa === "natal" || rec.dispensa === "anonovo") {
    const d = DISP[rec.dispensa];
    out.push({ id: "disp", cat: rec.dispensa, ini: d.ini, fim: d.fim, fixa: true });
  }
  return out;
}
/** Dia de apresentação: o dia seguinte ao fim, desde que não emende com outro afastamento nem passe do desligamento. */
function apresentacoes(rec) {
  const ps = afastamentos(rec).filter(valido);
  const res = [];
  ps.forEach(p => {
    const a = add(p.fim, 1);
    if (ps.some(q => q !== p && q.ini <= a && a <= q.fim)) return;
    if (rec.temDeslig && rec.deslig && a >= rec.deslig) return;
    res.push({ dia: a, de: p });
  });
  return res;
}
const nomeP = p => (CAT[p.cat] ? CAT[p.cat].n : "Afastamento sem motivo") + (p.ini && p.fim ? " (" + intTxt(p) + ")" : "");

/** Valida uma resposta. tipo: incompleto | conflito | aviso. step: passo do formulário onde se corrige. */
function validar(rec) {
  const out = [];
  const push = (tipo, step, msg, pid, bloq) => out.push({ tipo, step, msg, pid, bloq: !!bloq });
  (rec.periodos || []).forEach((p, i) => {
    const r = "Afastamento " + (i + 1) + (CAT[p.cat] ? " (" + CAT[p.cat].n + ")" : "");
    if (!CAT[p.cat]) push("incompleto", 1, r + ": escolha o motivo.", p.id);
    if (!p.ini || !p.fim) push("incompleto", 1, r + ": marque " + (!p.ini && !p.fim ? "o início e o fim" : !p.ini ? "o início" : "o fim") + " no calendário.", p.id);
    else if (p.fim < p.ini) push("conflito", 1, r + ": datas invertidas. O fim (" + f3(p.fim) + ") é anterior ao início (" + f3(p.ini) + ").", p.id);
    else if (p.ini < INI || p.fim > FIM) push("aviso", 1, r + ": parte das datas está fora do período do levantamento (01/11/2026 a 31/01/2027).", p.id);
  });
  if (!rec.dispensa) push("incompleto", 2, "Escolha a dispensa de fim de ano: Natal, Ano-Novo ou Sem dispensa.");
  if (rec.temDeslig !== true && rec.temDeslig !== false) push("incompleto", 3, "Informe se você tem data de desligamento no período.");
  else if (rec.temDeslig && !rec.deslig) push("incompleto", 3, "Marque no calendário a data de desligamento.");

  const outros = (rec.periodos || []).filter(valido);
  if (rec.dispensa === "natal" || rec.dispensa === "anonovo") {
    const outra = rec.dispensa === "natal" ? "anonovo" : "natal";
    const w = DISP[outra];
    outros.filter(p => sobrepoe(p, w)).forEach(p => {
      push("conflito", 2,
        "Você escolheu a " + DISP[rec.dispensa].n + ", mas " + nomeP(p) + " alcança o período da " + w.n +
        " (" + intTxt(w) + "). Para usufruir a " + DISP[rec.dispensa].n + ", é preciso estar disponível durante todo o período de " +
        intTxt(w) + ". Ajuste as datas do afastamento ou escolha “Sem dispensa”.", p.id);
    });
  }
  const todos = afastamentos(rec).filter(valido);
  for (let i = 0; i < todos.length; i++) for (let j = i + 1; j < todos.length; j++) {
    const a = todos[i], b = todos[j];
    if (sobrepoe(a, b)) push("conflito", a.fixa || b.fixa ? 2 : 1,
      nomeP(a) + " e " + nomeP(b) + " se sobrepõem em " + intTxt(intersec(a, b)) + ". Um mesmo dia não pode ter dois afastamentos: ajuste as datas.", (a.fixa ? b : a).id);
  }
  if (rec.temDeslig && rec.deslig) {
    todos.filter(p => p.fim >= rec.deslig).forEach(p => push("aviso", p.fixa ? 2 : 1,
      nomeP(p) + " vai até " + f3(p.fim) + ", mas o desligamento é em " + f3(rec.deslig) + ". A partir do desligamento você deixa de contar no efetivo; confira as datas.", p.id));
  }
  return out;
}
const bloqueia = iss => iss.some(i => i.tipo === "incompleto" || i.bloq);
const temConflito = iss => iss.some(i => i.tipo === "conflito" || i.tipo === "incompleto");

/* ======================= estado ======================= */
const S = {
  imp: { txt: "", itens: null, salvando: false },
  view: "form", gestor: false, wantDash: false, docOf: {}, meu: null, trocaDe: null,
  respostas: {},          // id -> registro salvo
  ready: false,
  backend: null,
  // formulário
  step: 0, mid: null, draft: null, baseRev: 0, editing: null, pickMonth: 1, pickStage: "ini", sending: false, sent: null, confirmConflito: false, staleRemote: null,
  // painel
  dMonth: 1, dSel: "2026-12-23", dMode: "dia", rIni: null, rFim: null, fMil: "todos", fCats: new Set(CATS.map(c => c.k)), mapScope: "mes", filtersOpen: false
};
try { const h = (location.hash || "").replace("#", ""); if (h === "painel") S.wantDash = true; } catch (e) {}

function novoRegistro(id) {
  return { id, militar: NOME[id], dispensa: null, temDeslig: null, deslig: null, periodos: [], rev: 0 };
}

/* ======================= base de dados ======================= */
const conn = (cls, txt) => { const el = document.getElementById("conn"); el.className = "conn " + cls; el.querySelector("span").textContent = txt; };
function banner(html, cls) { const b = document.getElementById("banner"); if (!html) { b.hidden = true; b.innerHTML = ""; return; } b.hidden = false; b.innerHTML = '<div class="' + (cls || "") + '">' + html + "</div>"; }

/* Várias respostas do mesmo militar (ex.: enviada pela conta dele e corrigida pelo gestor): vale a mais recente. */
function setRespostas(list) {
  const m = {}, docs = {};
  list.forEach(r => {
    if (!r || !NOME[r.id]) return;
    if (!m[r.id] || (r.atualizadoEm || "") > (m[r.id].atualizadoEm || "")) { m[r.id] = r; docs[r.id] = r._doc || r.id; }
  });
  S.respostas = m; S.docOf = docs; S.ready = true;
  if (S.mid && S.draft && m[S.mid] && (m[S.mid].rev || 0) !== S.baseRev && !S.sending && !S.sent) {
    // Sem alterações locais: carrega a versão nova em silêncio. Com alterações: pergunta qual manter.
    if (JSON.stringify(S.draft) === S.loaded && !S.editing) pickMilitar(S.mid); else S.staleRemote = m[S.mid];
  }
  render();
}
/* Gestor vê painel e todas as respostas; militar vê só o formulário e a própria resposta. */
function setRole(gestor) {
  S.gestor = !!gestor;
  document.getElementById("views").hidden = !S.gestor;
  if (S.gestor && S.wantDash) S.view = "dash";
  if (!S.gestor) S.view = "form";
  render();
}
const PRIV = "Suas respostas ficam visíveis apenas para o Maj Modesto";
const semDoc = r => { const o = clone(r); delete o._doc; return o; };

/* Adaptador 1: base do Claude (artifact db). Regras de acesso: só o dono do artifact lê a coleção inteira;
   cada militar lê e grava apenas o próprio documento respostas/<id da conta>. */
async function dbBackend(db, user) {
  const col = db.collection("respostas");
  let gestor = false, uid = null;
  try { gestor = user ? await user.isOwner() : false; } catch (e) {}
  try { uid = user ? await user.id() : null; } catch (e) {}
  setRole(gestor);
  if (gestor) {
    const listen = () => col.onSnapshot(snap => {
      conn("on", "Painel do gestor · todas as respostas em tempo real");
      setRespostas(snap.docs.filter(d => d.exists).map(d => ({ ...d.data(), _doc: d.id })));
    }, () => { conn("off", "Conexão interrompida. Recarregue a página."); setTimeout(listen, 3000); });
    listen();
  } else if (uid) {
    const listen = () => col.doc(uid).onSnapshot(snap => {
      conn("on", "Conectado · " + PRIV);
      S.meu = snap.exists ? snap.data() : null;
      setRespostas(S.meu ? [{ ...S.meu, _doc: uid }] : []);
    }, () => { conn("off", "Conexão interrompida. Recarregue a página."); setTimeout(listen, 3000); });
    listen();
  } else {
    conn("off", "Conta não identificada");
    banner("<b>Entre na sua conta claude.ai</b> e abra o link novamente para enviar sua resposta.", "b");
    S.ready = true; render();
  }
  return {
    kind: "db",
    async save(rec, expectedRev) {
      const ref = col.doc(gestor ? (S.docOf[rec.id] || rec.id) : uid);
      let cur;
      try { cur = await ref.get(); } catch (e) { if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); cur = await ref.get(); } else throw e; }
      const curRev = cur.exists ? (cur.data().rev || 0) : 0;
      if (curRev !== expectedRev) return { ok: false, conflict: true, current: cur.data() };
      const now = new Date().toISOString();
      const body = { ...semDoc(rec), rev: curRev + 1, atualizadoEm: now, enviadoEm: cur.exists ? (cur.data().enviadoEm || now) : now };
      await ref.set(body);
      return { ok: true, registro: body };
    }
  };
}

/* Adaptador 2: Google Apps Script + Planilha. Painel só com ?v=painel&chave=<chave do gestor>. */
async function gasBackend() {
  const call = (fn, ...args) => new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args));
  const loc = await new Promise(res => { try { google.script.url.getLocation(res); } catch (e) { res({ parameter: {} }); } });
  const chave = (loc.parameter && loc.parameter.chave) || "";
  if (loc.parameter && loc.parameter.v === "painel") S.wantDash = true;
  let gestor = false;
  const load = async () => {
    try { setRespostas((await call("listar", chave)) || []); conn("on", "Painel do gestor · planilha atualizada a cada 30 s"); return true; }
    catch (e) { return false; }
  };
  if (chave && await load()) {
    gestor = true; setRole(true);
    setInterval(() => { if (!document.hidden) load(); }, 30000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
  } else {
    if (chave) banner("<b>Chave do painel inválida.</b> Abrindo só o formulário.", "w");
    setRole(false); conn("on", "Conectado · " + PRIV); S.ready = true; render();
  }
  return {
    kind: "gas",
    async loadOne(id) {
      if (gestor) return;
      try { const r = await call("carregar", id); if (r) S.respostas[id] = r; else delete S.respostas[id]; } catch (e) {}
    },
    async save(rec, expectedRev) {
      const r = await call("salvar", JSON.stringify(semDoc(rec)), expectedRev);
      if (r && r.ok) S.respostas[rec.id] = r.registro;
      return r;
    }
  };
}

/* Adaptador 3: demonstração local (arquivo aberto fora da hospedagem). Os dados ficam só neste navegador. */
function localBackend() {
  const KEY = "afast-esao-demo";
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } };
  const write = o => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };
  setRole(true);
  setRespostas(Object.values(read()));
  window.addEventListener("storage", e => { if (e.key === KEY) setRespostas(Object.values(read())); });
  conn("", "Modo demonstração · os dados ficam só neste aparelho");
  banner("<b>Modo demonstração.</b> Esta cópia não está ligada a uma base compartilhada: as respostas ficam salvas apenas neste navegador.", "w");
  return {
    kind: "local",
    async save(rec, expectedRev) {
      const all = read(); const cur = all[rec.id]; const curRev = cur ? cur.rev || 0 : 0;
      if (curRev !== expectedRev) return { ok: false, conflict: true, current: cur };
      const now = new Date().toISOString();
      const body = { ...semDoc(rec), rev: curRev + 1, atualizadoEm: now, enviadoEm: cur ? (cur.enviadoEm || now) : now };
      all[rec.id] = body; write(all); setRespostas(Object.values(all));
      return { ok: true, registro: body };
    }
  };
}

/* ---------- mensagem com código (formulário sem login → painel) ---------- */
const COD = "AFX1.";
function codificar(rec) {
  const c = { v: 1, id: rec.id, d: rec.dispensa, t: rec.temDeslig, g: rec.deslig || null, ts: rec.atualizadoEm,
    p: (rec.periodos || []).map(p => [p.cat, p.ini, p.fim, p.obs || ""]) };
  return COD + btoa(unescape(encodeURIComponent(JSON.stringify(c)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
const DATA_RE = /^\d{4}-\d{2}-\d{2}$/;
function decodificar(code) {
  try {
    const b = code.slice(COD.length).replace(/-/g, "+").replace(/_/g, "/");
    const c = JSON.parse(decodeURIComponent(escape(atob(b + "===".slice((b.length + 3) % 4)))));
    if (!c || c.v !== 1 || !NOME[c.id] || !Array.isArray(c.p) || c.p.length > 30) return null;
    if (c.d !== null && !["natal", "anonovo", "sem"].includes(c.d)) return null;
    const periodos = c.p.map((x, i) => {
      if (!Array.isArray(x) || !CAT[x[0]] || CAT[x[0]].fixa || !DATA_RE.test(x[1]) || !DATA_RE.test(x[2])) throw 0;
      const p = { id: "m" + i, cat: x[0], ini: x[1], fim: x[2] };
      if (typeof x[3] === "string" && x[3].trim()) p.obs = x[3].trim().slice(0, 120);
      return p;
    });
    return { id: c.id, militar: NOME[c.id], dispensa: c.d, temDeslig: c.t === true ? true : c.t === false ? false : null,
      deslig: c.t === true && DATA_RE.test(c.g || "") ? c.g : null, periodos, geradoEm: typeof c.ts === "string" ? c.ts : "" };
  } catch (e) { return null; }
}
function mensagem(rec) {
  const disp = rec.dispensa === "sem" ? "Sem dispensa" : rec.dispensa ? DISP[rec.dispensa].n + " (" + intTxt(DISP[rec.dispensa]) + ")" : "não escolhida";
  const ps = (rec.periodos || []).filter(valido).map(p => "• " + CAT[p.cat].n + ": " + f3(p.ini) + " a " + f3(p.fim) + (p.obs ? " (" + p.obs + ")" : ""));

    "Afastamentos:" + (ps.length ? "\n" + ps.join("\n") : " nenhum"), "Desligamento: " + (rec.temDeslig && rec.deslig ? f3(rec.deslig) : "não"),

/* Adaptador 4: formulário sem login. Guarda as respostas só neste aparelho (para corrigir depois) e gera a mensagem. */
function avulsoBackend() {
  const KEY = "afast-esao-avulso";
  const read = () => { try { return JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { return {}; } };
  const write = o => { try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {} };
  setRole(false);
  setRespostas(Object.values(read()));
  conn("on", "Sem login · no final, envie a mensagem gerada ao Maj Modesto");
  return {
    kind: "avulso",
    async save(rec, expectedRev) {
      const all = read(); const cur = all[rec.id];
      const now = new Date().toISOString();
      const body = { ...semDoc(rec), rev: (cur ? cur.rev || 0 : 0) + 1, atualizadoEm: now, enviadoEm: cur ? (cur.enviadoEm || now) : now };
      all[rec.id] = body; write(all); setRespostas(Object.values(all));
      return { ok: true, registro: body };
    }
  };
}

async function initBackend() {
  if (AVULSO) { S.backend = avulsoBackend(); return; }
  if (window.google && google.script && google.script.run) { S.backend = await gasBackend(); return; }
  if (window.claude && typeof window.claude.use === "function") {
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]); } catch (e) {}
    if (db) { S.backend = await dbBackend(db, user); checkWrite(user); return; }
    setRole(false);
    conn("off", "Base indisponível");
    banner("<b>Não foi possível abrir a base de respostas.</b> Entre na sua conta claude.ai e abra o link novamente. Sem a base, a resposta não pode ser enviada.", "b");
    S.ready = true; S.backend = null; render(); return;
  }
  S.backend = localBackend();
}
async function checkWrite(user) {
  try {
    if (user && typeof user.can === "function" && await user.can("data.write") === false)
      banner("<b>Seu acesso é somente leitura.</b> Você não consegue enviar respostas. Peça ao Maj Modesto para compartilhar o link com você com permissão de edição.", "w");
  } catch (e) {}
}

/* calendário de seleção (intervalo do editor ou data de desligamento) */
function pickCal(mode) {
  const mi = S.pickMonth, dias = mesDias(mi), e = S.editing, r = S.draft;
  const others = afastamentos(r).filter(p => valido(p) && (!e || p.id !== e.id));
  const pad = wd(dias[0]);
  let cells = "";
  for (let i = 0; i < pad; i++) cells += '<span class="day blank"></span>';
  dias.forEach(d => {
    let cls = "day" + (wd(d) === 0 || wd(d) === 6 ? " we" : "") + (FERIADOS[d] ? " fer" : "");
    let lbl = fw(d) + (FERIADOS[d] ? ", feriado: " + FERIADOS[d] : "");
    if (mode === "range") {
      if (e.ini && e.fim && d > e.ini && d < e.fim) cls += " in";
      if (d === e.ini || d === e.fim) cls += " edge";
    } else if (r.deslig === d) cls += " edge";

/** Situação de um militar num dia. Nunca conta ninguém duas vezes: retorna um único estado por pessoa. */
function situacao(id, d) {
  const r = S.respostas[id];
  if (!r) return { k: "pend" };
  if (r.temDeslig && r.deslig && d >= r.deslig) return { k: "desl" };
  const ps = afastamentos(r).filter(p => valido(p) && p.ini <= d && d <= p.fim);
  const ap = apresentacoes(r).filter(a => a.dia === d);
  if (ps.length) return { k: "fora", ps };
  return { k: "disp", apres: ap };
}

function contDia(d) {

  milsFiltro().forEach(m => {
    const s = situacao(m.id, d);
    if (s.k === "desl") { c.desl++; const r = S.respostas[m.id]; if (r.deslig === d) c.dsl++; return; }
    c.efetivo++;
    if (s.k === "pend") c.pend++;
    else if (s.k === "fora") { c.fora++; const fp = s.ps.filter(p => catOn(p.cat)); if (fp.length) { c.foraF++; fp.forEach(p => c.cats.add(p.cat)); } }
    else { c.disp++; if (s.apres.length) c.apr++; }
  });
  return c;
}

    const r = S.respostas[x.m.id];
    return '<div class="st-item"><div><strong>' + esc(x.m.nome) + "</strong><small>" + (r ? "Atualizado em " + esc(fmtHora(r.atualizadoEm)) + (r.rev > 1 ? " · " + r.rev + " versões" : "") : "Ainda não respondeu") + "</small></div>" +
      '<button class="btn sm" data-act="openfor" data-id="' + x.m.id + '">' + (r ? "Ver/corrigir" : "Preencher") + "</button>" +
      (k === "bad" ? "<ul>" + x.s.iss.filter(i => i.tipo !== "aviso").map(i => "<li>" + esc(i.msg) + "</li>").join("") + "</ul>" : "") +
      (k === "ok" && x.s.iss.length ? "<ul>" + x.s.iss.map(i => "<li>Atenção: " + esc(i.msg) + "</li>").join("") + "</ul>" : "") + "</div>";
  }).join("") : '<p class="empty">Nenhum.</p>') + "</div></div></div>";
  return '<section class="sec full" id="status" aria-label="Situação das respostas"><div class="sec-h"><h2>Respostas</h2><p>' + st.filter(x => x.s.k !== "pend").length + " de 13 responderam</p></div><div class=\"status-cols\">" +
    col("bad", "! Precisam corrigir", st.filter(x => x.s.k === "bad")) + col("pend", "○ Pendentes", st.filter(x => x.s.k === "pend")) + col("ok", "✓ Respondidos", st.filter(x => x.s.k === "ok")) + "</div></section>";
}
/* Respostas recebidas pelo formulário sem login (mensagem com código). */
function lerImportacao() {
  const codes = (S.imp.txt.match(/AFX1\.[A-Za-z0-9_-]+/g) || []);
  const vistos = {};
  const itens = codes.map(c => decodificar(c)).map((r, i) => ({ r, cod: codes[i] }));
  // mesma pessoa mais de uma vez na colagem: fica a mensagem mais recente
  itens.forEach(x => { if (x.r && (!vistos[x.r.id] || x.r.geradoEm > vistos[x.r.id].r.geradoEm)) vistos[x.r.id] = x; });
  S.imp.itens = itens.map(x => {
    if (!x.r) return { erro: true };
    if (vistos[x.r.id] !== x) return { dup: true, r: x.r };
    const atual = S.respostas[x.r.id];
    const ref = atual ? (atual.geradoEm || atual.atualizadoEm || "") : "";
    const antigo = !!atual && x.r.geradoEm && ref >= x.r.geradoEm;
    return { r: x.r, atual, antigo, ok: !antigo, iss: validar(x.r) };
  });
  if (!codes.length) toast("Nenhum código encontrado. Cole a mensagem inteira, incluindo a linha que começa com AFX1.");
}
async function salvarImportacao() {
  const alvo = (S.imp.itens || []).filter(x => x.ok);
  if (!alvo.length || S.imp.salvando) return;
  S.imp.salvando = true; render();
  let n = 0, falhas = 0;
  for (const x of alvo) {
    try {
      const atual = S.respostas[x.r.id];
      const res = await S.backend.save({ ...x.r, origem: "mensagem" }, atual ? atual.rev || 0 : 0);
      if (res && res.ok) { n++; S.respostas[x.r.id] = { ...res.registro, _doc: S.docOf[x.r.id] || x.r.id }; } else falhas++;
    } catch (e) { falhas++; }
  }
  S.imp = { txt: "", itens: null, salvando: false };
  render();
  toast(n + " resposta" + (n === 1 ? "" : "s") + " importada" + (n === 1 ? "" : "s") + (falhas ? " · " + falhas + " com falha, tente de novo" : "") + ".");
}
function renderImport() {
  const it = S.imp.itens;
  let lista = "";
  if (it) {
    const validos = it.filter(x => x.ok).length;
    lista = '<ul class="who" style="margin-top:12px">' + it.map(x => {
      if (x.erro) return '<li><strong>Código inválido ou incompleto</strong><span class="why"><span>Peça ao militar para reenviar a mensagem sem alterar o código.</span></span></li>';
      if (x.dup) return "<li><strong>" + esc(NOME[x.r.id]) + '</strong><span class="why"><span>Mensagem repetida: vale a mais recente desta colagem.</span></span></li>';
      const st = temConflito(x.iss) ? '<span class="pill bad">! Precisa corrigir</span>' : '<span class="pill ok">✓ Sem conflito</span>';
      return "<li><strong>" + esc(NOME[x.r.id]) + " · gerada em " + esc(fmtHora(x.r.geradoEm)) + '</strong><span class="why">' +
        (x.antigo ? '<span class="pill warn">Mais antiga que a resposta já registrada · não será importada</span>' : st + "<span>" + (x.atual ? "Substitui a resposta atual" : "Nova resposta") + "</span>") +
        "<span>" + esc((x.r.periodos.length ? x.r.periodos.map(p => CAT[p.cat].n + " " + intTxt(p)).join("; ") : "Sem afastamentos") + " · " + (x.r.dispensa === "sem" ? "Sem dispensa" : x.r.dispensa ? DISP[x.r.dispensa].n : "dispensa não escolhida")) + "</span></span></li>";
    }).join("") + "</ul>" +
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn pri" data-act="impok" ' + (validos && !S.imp.salvando ? "" : "disabled") + ">" + (S.imp.salvando ? "Salvando…" : "Salvar " + validos + " resposta" + (validos === 1 ? "" : "s")) + '</button><button class="btn" data-act="impclear">Limpar</button></div>';
  }
  return '<section class="sec full" aria-label="Importar respostas por mensagem"><div class="sec-h"><h2>Respostas recebidas por mensagem</h2><p>De quem preencheu o formulário sem login</p></div>' +
    '<p class="hint" style="margin:0 0 8px;font-size:13px">Cole aqui as mensagens recebidas pelo WhatsApp ou e-mail (pode colar várias de uma vez) e toque em Ler.</p>' +
    '<textarea id="imptxt" rows="4" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--surface);font:13px/1.4 var(--f-body);resize:vertical" placeholder="LEVANTAMENTO DE AFASTAMENTOS · Cur Inf EsAO&#10;Militar: …&#10;Código (não alterar):&#10;AFX1.…">' + esc(S.imp.txt) + "</textarea>" +
    '<div style="margin-top:8px"><button class="btn" data-act="impler">Ler mensagens</button></div>' + lista + "</section>";
}
function renderDates() {
  const ev = [];
  milsFiltro().forEach(m => {
    const r = S.respostas[m.id]; if (!r) return;
    apresentacoes(r).forEach(a => ev.push({ d: a.dia, t: "Apresentação", m, x: "Fim de " + CAT[a.de.cat].n + " (" + intTxt(a.de) + ")" }));
    if (r.temDeslig && r.deslig) ev.push({ d: r.deslig, t: "Desligamento", m, x: "Deixa de contar no efetivo a partir desta data" });
  });
  ev.sort((a, b) => a.d < b.d ? -1 : a.d > b.d ? 1 : a.m.nome < b.m.nome ? -1 : 1);
  return '<section class="sec full" aria-label="Apresentações e desligamentos"><div class="sec-h"><h2>Apresentações e desligamentos</h2><p>Apresentação = dia seguinte ao fim do afastamento</p></div>' +
    (ev.length ? '<ul class="evl">' + ev.map(e => '<li><span class="evd num"><b>' + esc(f2(e.d)) + "</b>" + WD[wd(e.d)] + " · " + e.d.slice(0, 4) + '</span><span><strong>' + (e.t === "Apresentação" ? "▲ Apresentação" : "✕ Desligamento") + " · " + esc(e.m.nome) + "</strong><small>" + esc(e.x) + "</small></span></li>").join("") + "</ul>" :
      '<p class="empty">Nenhuma data registrada ainda.</p>') + "</section>";
}
function whoModal(id) {
  const r = S.respostas[id], st = statusDe(id);
  const layer = document.getElementById("layer");
  layer.innerHTML = '<div class="modal" data-act="mclose"><div class="card" role="dialog" aria-modal="true" aria-label="' + esc(NOME[id]) + '" data-stop="1"><div class="sec-h"><h2>' + esc(NOME[id]) + "</h2>" + pill(st) + "</div>" +
    (r ? personStrip(r) + resumoLista(r) + (st.iss.length ? issuesHtml(st.iss, false) : "") + '<p class="hint" style="margin-top:10px">Atualizado em ' + esc(fmtHora(r.atualizadoEm)) + "</p>" : '<p class="empty">Ainda não respondeu. Não é contado como disponível.</p>') +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px"><button class="btn" data-act="mclose">Fechar</button><button class="btn pri" data-act="openfor" data-id="' + id + '">' + (r ? "Corrigir resposta" : "Preencher") + "</button></div></div></div>";
  const b = layer.querySelector('[data-act="mclose"].btn'); if (b) b.focus();
}
function toast(t) { const l = document.createElement("div"); l.className = "toast"; l.setAttribute("role", "status"); l.textContent = t; document.body.appendChild(l); setTimeout(() => l.remove(), 2600); }

/* ======================= ações ======================= */
function pickMilitar(id) {
  S.mid = id; S.staleRemote = null; S.confirmConflito = false;
  const r = S.respostas[id];
  S.draft = r ? clone(r) : novoRegistro(id);
  S.baseRev = r ? (r.rev || 0) : 0;
  // Militar: a conta tem um único documento; trocar de nome substitui a resposta anterior desta conta.
  S.trocaDe = null;
  if (!S.gestor && S.meu && S.meu.id !== id) { S.baseRev = S.meu.rev || 0; S.trocaDe = S.meu.id; }
  S.loaded = JSON.stringify(S.draft);
}
function scrollTop() { try { window.scrollTo({ top: 0 }); } catch (e) {} }
async function enviar() {
  const iss = validar(S.draft);
  if (bloqueia(iss)) return;
  if (temConflito(iss) && !S.confirmConflito) { S.confirmConflito = true; render(); return; }
  S.sending = true; render();
  try {
    const rec = clone(S.draft); rec.militar = NOME[rec.id];
    const res = await S.backend.save(rec, S.baseRev);
    if (res && res.ok) {
      S.respostas[rec.id] = res.registro; S.sent = rec.id; S.baseRev = res.registro.rev; S.staleRemote = null; S.confirmConflito = false;
    } else if (res && res.conflict) {
      S.staleRemote = res.current || null;
      toast("Esta resposta foi alterada em outro aparelho. Escolha qual versão manter.");
    } else toast("Não foi possível enviar. Tente de novo.");
  } catch (e) {
    toast(e && e.code === "invalid_argument" ? "Sem permissão para gravar na base. Peça acesso de edição ao Maj Modesto." : "Falha ao enviar: " + (e && e.message || e));
  }
  S.sending = false; render(); scrollTop();
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("[data-act]");
  if (!t) return;
  if (t.dataset.act === "mclose" && ev.target.closest("[data-stop]") && !ev.target.closest(".btn")) return;
  const a = t.dataset.act, d = t.dataset;
  const e = S.editing;
  switch (a) {
    case "view": if (!S.gestor) return; S.view = d.v; try { history.replaceState(null, "", d.v === "dash" ? "#painel" : "#"); } catch (x) {} render(); scrollTop(); return;
    case "pick": if (S.backend && S.backend.loadOne) { const id = d.id; S.backend.loadOne(id).then(() => { const had = !!S.respostas[id]; pickMilitar(id); S.step = had ? 4 : 1; render(); scrollTop(); if (had) toast("Sua resposta foi carregada. Revise e corrija o que precisar."); }); return; }
    { const had = !!S.respostas[d.id]; pickMilitar(d.id); S.step = had ? 4 : 1; render(); scrollTop(); if (had) toast("Sua resposta foi carregada. Revise e corrija o que precisar."); return; }
    case "step": if (S.mid) { S.step = +d.i; S.editing = null; S.confirmConflito = false; render(); scrollTop(); } return;
    case "next": if (S.mid) { S.step = Math.min(4, S.step + 1); S.confirmConflito = false; if (S.step === 3 && S.draft.deslig) S.pickMonth = MESES.findIndex(M => +S.draft.deslig.slice(5, 7) - 1 === M.m); render(); scrollTop(); } return;
    case "prev": S.step = Math.max(0, S.step - 1); S.confirmConflito = false; render(); scrollTop(); return;
    case "new": S.editing = { id: "p" + uid(), cat: null, ini: null, fim: null, obs: "", isNew: true }; S.pickStage = "ini"; render(); scrollTop(); return;
    case "edit": { const p = S.draft.periodos.find(x => x.id === d.pid); if (!p) return; S.editing = { ...clone(p), isNew: false }; S.pickStage = "ini"; S.pickMonth = p.ini ? Math.max(0, MESES.findIndex(M => +p.ini.slice(5, 7) - 1 === M.m)) : 1; render(); scrollTop(); return; }
    case "del": S.draft.periodos = S.draft.periodos.filter(x => x.id !== d.pid); render(); toast("Afastamento removido. Lembre-se de enviar no final."); return;
    case "ecat": e.cat = d.k; render(); return;
    case "pmonth": S.pickMonth = +d.i; render(); return;
    case "pday": {
      const day = d.d;
      if (S.pickStage === "ini" || !e.ini) { e.ini = day; e.fim = null; S.pickStage = "fim"; }
      else if (day < e.ini) { e.ini = day; e.fim = null; S.pickStage = "fim"; }
      else { e.fim = day; S.pickStage = "ini"; }
      render(); return;
    }
    case "ecancel": S.editing = null; render(); scrollTop(); return;
    case "esave": {
      if (CAT[e.cat] && CAT[e.cat].fixa) { S.draft.dispensa = e.cat; S.draft.periodos = S.draft.periodos.filter(x => x.id !== e.id); S.editing = null; render(); toast(CAT[e.cat].n + " registrada com as datas fixas."); return; }
      const obs = (document.getElementById("obs") || {}).value || "";
      const p = { id: e.id, cat: e.cat, ini: e.ini, fim: e.fim }; if (obs.trim()) p.obs = obs.trim().slice(0, 120);
      const i = S.draft.periodos.findIndex(x => x.id === e.id);
      if (i >= 0) S.draft.periodos[i] = p; else S.draft.periodos.push(p);
      S.draft.periodos.sort((x, y) => x.ini < y.ini ? -1 : 1);
      S.editing = null; render(); scrollTop(); return;
    }
    case "disp": S.draft.dispensa = d.k; render(); return;
    case "tdes": S.draft.temDeslig = d.v === "1"; if (!S.draft.temDeslig) S.draft.deslig = null; else S.pickMonth = S.draft.deslig ? MESES.findIndex(M => +S.draft.deslig.slice(5, 7) - 1 === M.m) : 2; render(); return;
    case "dday": S.draft.deslig = d.d; render(); return;
    case "send": enviar(); return;
    case "copymsg": {
      const ta = document.getElementById("msgtxt");
      const fallback = () => { ta.focus(); ta.select(); toast("Texto selecionado. Use Copiar do seu aparelho."); };
      try { navigator.clipboard.writeText(ta.value).then(() => toast("Mensagem copiada."), fallback); } catch (x) { fallback(); }
      return;
    }
    case "impler": lerImportacao(); render(); return;
    case "impok": salvarImportacao(); return;
    case "impclear": S.imp = { txt: "", itens: null }; render(); return;
    case "loadRemote": pickMilitar(S.mid); render(); return;
    case "keepMine": S.baseRev = S.staleRemote.rev || 0; S.staleRemote = null; render(); return;
    case "reedit": { const id = S.sent; S.sent = null; pickMilitar(id); S.step = 1; render(); scrollTop(); return; }
    case "restart": S.sent = null; S.mid = null; S.draft = null; S.step = 0; render(); scrollTop(); return;
    // painel
    case "dmonth": S.dMonth = +d.i; render(); return;
    case "dmode": S.dMode = d.v; render(); return;
    case "dsel": {
      if (S.dMode === "dia") S.dSel = d.d;
      else if (!S.rIni || S.rFim) { S.rIni = d.d; S.rFim = null; }
      else if (d.d < S.rIni) { S.rFim = S.rIni; S.rIni = d.d; }
      else S.rFim = d.d;
      render(); return;
    }
    case "rclear": S.rIni = S.rFim = null; render(); return;
    case "fcat": if (S.fCats.has(d.k)) S.fCats.delete(d.k); else S.fCats.add(d.k); render(); return;
    case "fall": S.fCats = filtroCatAtivo() ? new Set(CATS.map(c => c.k)) : new Set(); render(); return;
    case "fclear": S.fCats = new Set(CATS.map(c => c.k)); S.fMil = "todos"; render(); return;
    case "mscope": S.mapScope = d.v; render(); return;
    case "who": whoModal(d.id); return;
    case "mclose": document.getElementById("layer").innerHTML = ""; return;
    case "openfor": if (!S.gestor) return; document.getElementById("layer").innerHTML = ""; S.view = "form"; S.sent = null; S.editing = null; pickMilitar(d.id); S.step = S.respostas[d.id] ? 4 : 1; render(); scrollTop(); return;
  }
});
document.addEventListener("toggle", ev => { if (ev.target.id === "filtros") S.filtersOpen = ev.target.open; }, true);
document.addEventListener("change", ev => {
  if (ev.target.id === "fmil") { S.fMil = ev.target.value; render(); }
});
document.addEventListener("input", ev => {
  if (ev.target.id === "obs" && S.editing) S.editing.obs = ev.target.value;
  if (ev.target.id === "imptxt") S.imp.txt = ev.target.value;
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape" && document.getElementById("layer").innerHTML) document.getElementById("layer").innerHTML = ""; });

render();
initBackend();
</script>
